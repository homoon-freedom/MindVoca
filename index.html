<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>마음의 52주 · 어휘·감정·욕구·판단</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --cat-strip-bg: #e8edf3;
      --header-bg: #101828;
      --header-border: #1e293b;
      --day-tab-bg: #182234;
      --day-tab-border: #293548;
      --day-tab-hover: #233047;
      --day-tab-text: #cbd5e1;
      --day-tab-active-bg: #dc2626;
      --day-tab-active-border: #dc2626;
      --day-tab-active-text: #ffffff;
      --day-tab-active-shadow: rgba(220, 38, 38, 0.35);
      --util-btn-bg: #1d2939;
      --util-btn-border: #334155;
      --util-btn-hover: #29384e;
      --util-btn-active: #2b3b52;
      --toolbar-pill-bg: #101828;

      --accent-red: #dc2626;
      --accent-green: #16a34a;
      --accent-indigo: #4f46e5;
      --accent-amber: #d97706;
      --accent-blue: #2563eb;

      --book-teal: #4c867d;
      --book-teal-soft: #567d77;
      --book-teal-line: #b5cfc9;
      --book-quote: #3f6f68;
      --book-author: #6b918b;
      --book-orig: #82a39e;

      --bg-canvas: #ffffff;
      --bg-sidebar: #f8fafc;
      --border-light: #e2e8f0;
      --text-primary: #0f172a;
      --text-body: #1f2937;
      --text-secondary: #475569;
      --text-muted: #64748b;
      --radius-lg: 14px;
      --radius-md: 10px;
      --shadow-sm: 0 1px 3px rgba(15, 23, 42, 0.06);
      --sidebar-width: 280px;
    }

    /* 카테고리별 테마 (탭색 = 타이틀/헤더 배경색 동일 + 본문 타이틀 색 조화) */
    body[data-category="word"] {
      --header-bg: #101828;
      --header-border: #1e293b;
      --day-tab-bg: #182234;
      --day-tab-border: #293548;
      --day-tab-hover: #233047;
      --day-tab-text: #cbd5e1;
      --day-tab-active-bg: #dc2626;
      --day-tab-active-border: #dc2626;
      --day-tab-active-text: #ffffff;
      --day-tab-active-shadow: rgba(220, 38, 38, 0.35);
      --util-btn-bg: #1d2939;
      --util-btn-border: #334155;
      --util-btn-hover: #29384e;
      --util-btn-active: #2b3b52;
      --toolbar-pill-bg: #101828;
      --book-teal: #4c867d;
      --book-teal-soft: #567d77;
      --book-teal-line: #b5cfc9;
      --book-quote: #3f6f68;
      --book-author: #6b918b;
      --book-orig: #82a39e;
    }

    body[data-category="emotion"] {
      --header-bg: #15803d;
      --header-border: #166534;
      --day-tab-bg: rgba(255, 255, 255, 0.13);
      --day-tab-border: rgba(255, 255, 255, 0.25);
      --day-tab-hover: rgba(255, 255, 255, 0.22);
      --day-tab-text: #ecfdf5;
      --day-tab-active-bg: #ffffff;
      --day-tab-active-border: #ffffff;
      --day-tab-active-text: #14532d;
      --day-tab-active-shadow: rgba(5, 46, 22, 0.26);
      --util-btn-bg: rgba(255, 255, 255, 0.15);
      --util-btn-border: rgba(255, 255, 255, 0.28);
      --util-btn-hover: rgba(255, 255, 255, 0.24);
      --util-btn-active: rgba(255, 255, 255, 0.30);
      --toolbar-pill-bg: #15803d;
      --book-teal: #15803d;
      --book-teal-soft: #2e6b46;
      --book-teal-line: #bbf7d0;
      --book-quote: #166534;
      --book-author: #4a7c5d;
      --book-orig: #5e9472;
    }

    body[data-category="needs"] {
      --header-bg: #1d4ed8;
      --header-border: #1e40af;
      --day-tab-bg: rgba(255, 255, 255, 0.13);
      --day-tab-border: rgba(255, 255, 255, 0.25);
      --day-tab-hover: rgba(255, 255, 255, 0.22);
      --day-tab-text: #eff6ff;
      --day-tab-active-bg: #ffffff;
      --day-tab-active-border: #ffffff;
      --day-tab-active-text: #1e3a8a;
      --day-tab-active-shadow: rgba(23, 37, 84, 0.26);
      --util-btn-bg: rgba(255, 255, 255, 0.15);
      --util-btn-border: rgba(255, 255, 255, 0.28);
      --util-btn-hover: rgba(255, 255, 255, 0.24);
      --util-btn-active: rgba(255, 255, 255, 0.30);
      --toolbar-pill-bg: #1d4ed8;
      --book-teal: #1d4ed8;
      --book-teal-soft: #3b5fa8;
      --book-teal-line: #bfdbfe;
      --book-quote: #1e40af;
      --book-author: #5a7bb5;
      --book-orig: #6f8fc7;
    }

    body[data-category="judge"] {
      --header-bg: #cf4e0a;
      --header-border: #b44308;
      --day-tab-bg: rgba(255, 255, 255, 0.14);
      --day-tab-border: rgba(255, 255, 255, 0.27);
      --day-tab-hover: rgba(255, 255, 255, 0.23);
      --day-tab-text: #fff7ed;
      --day-tab-active-bg: #ffffff;
      --day-tab-active-border: #ffffff;
      --day-tab-active-text: #9a3412;
      --day-tab-active-shadow: rgba(124, 45, 18, 0.26);
      --util-btn-bg: rgba(255, 255, 255, 0.16);
      --util-btn-border: rgba(255, 255, 255, 0.30);
      --util-btn-hover: rgba(255, 255, 255, 0.25);
      --util-btn-active: rgba(255, 255, 255, 0.31);
      --toolbar-pill-bg: #cf4e0a;
      --book-teal: #cf4e0a;
      --book-teal-soft: #9a4a24;
      --book-teal-line: #fed7aa;
      --book-quote: #b44308;
      --book-author: #b06742;
      --book-orig: #c47a54;
    }

    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    html, body {
      margin: 0; padding: 0; height: 100%;
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', sans-serif;
      background-color: var(--bg-canvas);
      color: var(--text-primary);
      overflow: hidden;
    }

    .app-shell { display: flex; flex-direction: column; height: 100dvh; width: 100%; }

    .hdr-btn {
      border: none; border-radius: 9px; padding: 9px 14px;
      font-size: 13.5px; font-weight: 600; font-family: inherit;
      color: #ffffff; cursor: pointer; transition: filter 0.14s ease;
    }
    .hdr-btn:hover { filter: brightness(1.08); }
    .hdr-btn.btn-green { background: var(--accent-green); }
    .hdr-btn.btn-indigo { background: var(--accent-indigo); }
    .hdr-btn.btn-teal { background: var(--book-teal); }

    /* 최상단 폴더형 카테고리 탭 바 (어휘 · 감정 · 욕구 · 판단) */
    .cat-tabs-strip {
      background: var(--cat-strip-bg);
      padding: 8px 14px 0 14px;
      display: flex;
      align-items: flex-end;
      gap: 6px;
      flex-shrink: 0;
      position: relative;
      z-index: 32;
      user-select: none;
    }

    .cat-tab {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 88px;
      padding: 8px 22px 7px;
      border: none;
      border-radius: 12px 12px 0 0;
      background: var(--tab-bg);
      color: #ffffff;
      font-family: inherit;
      font-size: 14.5px;
      font-weight: 700;
      letter-spacing: -0.015em;
      cursor: pointer;
      opacity: 0.78;
      transform: translateY(1px);
      box-shadow: inset 0 -4px 7px rgba(0, 0, 0, 0.22);
      transition: opacity 0.16s ease, transform 0.16s ease, padding 0.16s ease, box-shadow 0.16s ease;
    }
    .cat-tab[data-cat="word"]    { --tab-bg: #101828; }
    .cat-tab[data-cat="emotion"] { --tab-bg: #15803d; }
    .cat-tab[data-cat="needs"]   { --tab-bg: #1d4ed8; }
    .cat-tab[data-cat="judge"]   { --tab-bg: #cf4e0a; }

    .cat-tab:hover:not(.active) {
      opacity: 0.94;
      transform: translateY(0);
    }

    /* 선택된 탭: 하단 요일 헤더 바와 동일 배경색으로 경계선 없이 부드럽게 일체화 */
    .cat-tab.active {
      opacity: 1;
      z-index: 6;
      padding-top: 10px;
      padding-bottom: 10px;
      margin-bottom: -1px;
      transform: translateY(0);
      box-shadow: 0 -2px 8px rgba(15, 23, 42, 0.10);
    }

    /* 폴더 탭 하단 바깥쪽 부드러운 곡선 연결 (이미지 스케치 형태 구현) */
    .cat-tab.active::before,
    .cat-tab.active::after {
      content: "";
      position: absolute;
      bottom: 0;
      width: 11px;
      height: 11px;
      pointer-events: none;
      z-index: 2;
    }
    .cat-tab.active::before {
      left: -11px;
      background: radial-gradient(circle at 0 0, transparent 10.6px, var(--tab-bg) 11px);
    }
    .cat-tab.active::after {
      right: -11px;
      background: radial-gradient(circle at 100% 0, transparent 10.6px, var(--tab-bg) 11px);
    }

    /* 상단 헤더 (단일 행: 목록 · 설정 · 일~토요일) — 활성 카테고리 탭색과 동일 배경 */
    .top-header {
      background: var(--header-bg);
      color: #ffffff;
      padding: 10px 14px;
      border-bottom: 1px solid var(--header-border);
      flex-shrink: 0;
      position: relative;
      z-index: 30;
      transition: background-color 0.18s ease, border-color 0.18s ease;
    }

    .day-tabs-wrap {
      display: flex; align-items: stretch; gap: 6px;
      overflow-x: auto; padding-bottom: 2px; scrollbar-width: none;
    }
    .day-tabs-wrap::-webkit-scrollbar { display: none; }

    .day-tab {
      flex: 1 0 auto; min-width: 72px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
      padding: 8px 10px; border-radius: 9px;
      border: 1px solid var(--day-tab-border);
      background: var(--day-tab-bg);
      color: var(--day-tab-text);
      font-family: inherit; cursor: pointer;
      transition: all 0.16s ease;
    }
    .day-tab:hover { background: var(--day-tab-hover); color: #ffffff; }
    .day-tab.active {
      background: var(--day-tab-active-bg);
      border-color: var(--day-tab-active-border);
      color: var(--day-tab-active-text);
      box-shadow: 0 3px 10px var(--day-tab-active-shadow);
    }
    .day-tab-name { font-size: 14px; font-weight: 700; line-height: 1.1; white-space: nowrap; }
    .day-tab-sub { font-size: 10.5px; opacity: 0.88; font-weight: 500; white-space: nowrap; }
    .day-tab.active .day-tab-sub { opacity: 0.92; font-weight: 600; }

    .tab-util-btn {
      flex: 0 0 auto; min-width: 52px;
      display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
      padding: 7px 10px; border-radius: 9px;
      border: 1px solid var(--util-btn-border);
      background: var(--util-btn-bg);
      color: #ffffff; font-family: inherit; cursor: pointer;
      transition: all 0.16s ease;
    }
    .tab-util-btn:hover { background: var(--util-btn-hover); color: #ffffff; }
    .tab-util-btn.is-active {
      background: var(--util-btn-active);
      border-color: rgba(255, 255, 255, 0.45);
      color: #ffffff;
    }
    .tab-util-label { font-size: 10px; font-weight: 600; line-height: 1; opacity: 0.95; }

    /* 기본(태블릿·PC) 레이아웃: 좌측 고정 사이드바 + 우측 본문 */
    .workspace {
      display: flex; flex-direction: row; flex: 1; min-height: 0;
      position: relative; overflow: hidden;
    }

    .sidebar-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.45); z-index: 35;
    }

    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border-light);
      display: flex; flex-direction: column; flex-shrink: 0;
      z-index: 20;
      transition: margin-left 0.22s ease, transform 0.24s ease;
    }
    .sidebar.collapsed {
      margin-left: calc(var(--sidebar-width) * -1);
    }

    .sidebar-header {
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--border-light);
      background: #ffffff;
    }
    .sidebar-day-title {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px;
    }
    .sidebar-day-label { font-size: 14px; font-weight: 700; color: var(--text-primary); }
    .sidebar-header-right { display: flex; align-items: center; gap: 6px; }
    .sidebar-count-pill {
      font-size: 11px; font-weight: 700; background: #f0fdf4;
      color: #15803d; padding: 2px 8px; border-radius: 999px;
      border: 1px solid #bbf7d0;
    }
    .sidebar-close-btn {
      display: none;
      border: none; background: #f1f5f9; color: var(--text-secondary);
      width: 28px; height: 28px; border-radius: 7px;
      font-size: 18px; line-height: 1; cursor: pointer;
      align-items: center; justify-content: center;
    }
    .sidebar-close-btn:hover { background: #e2e8f0; color: var(--text-primary); }

    .search-box { position: relative; width: 100%; }
    .search-input {
      width: 100%; padding: 8px 30px 8px 12px; border-radius: var(--radius-md);
      border: 1px solid var(--border-light); background: #f8fafc;
      color: var(--text-primary); font-size: 16px; font-family: inherit; outline: none;
    }
    .search-input:focus { border-color: var(--book-teal); background: #ffffff; }
    .search-clear {
      position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
      border: none; background: transparent; color: var(--text-muted);
      font-size: 16px; cursor: pointer; display: none; padding: 4px;
    }

    .word-list { flex: 1; overflow-y: auto; padding: 10px 10px 24px; -webkit-overflow-scrolling: touch; }

    .word-item {
      width: 100%; text-align: left; display: flex; align-items: center; gap: 10px;
      padding: 9px 10px; margin-bottom: 4px; border-radius: var(--radius-md);
      border: 1px solid transparent; background: transparent;
      cursor: pointer; font-family: inherit; transition: all 0.14s ease;
    }
    .word-item:hover { background: #ffffff; border-color: #e2e8f0; }
    .word-item.is-read {
      background: #f0fdf4; border-color: #bbf7d0;
    }
    .word-item.is-read:hover {
      background: #dcfce7; border-color: #86efac;
    }
    .word-item.active {
      background: #fef2f2; border-color: #fecaca;
      box-shadow: 0 1px 4px rgba(220, 38, 38, 0.08);
    }
    .word-item.active.is-read {
      background: #dcfce7; border-color: #4ade80;
      box-shadow: 0 1px 5px rgba(22, 163, 74, 0.16);
    }
    .word-item.active.is-read .word-item-title { color: #166534; font-weight: 700; }

    .item-num {
      flex-shrink: 0; width: 30px; height: 26px; border-radius: 7px;
      border: 1px solid transparent; padding: 0;
      background: #e2e8f0; color: var(--text-secondary);
      font-size: 11.5px; font-weight: 700; font-family: inherit;
      display: inline-flex; align-items: center; justify-content: center;
      cursor: pointer; transition: all 0.14s ease;
    }
    .item-num:hover {
      filter: brightness(0.95);
      transform: scale(1.06);
    }
    .word-item.active .item-num { background: var(--accent-red); color: #ffffff; }
    .word-item.is-read .item-num,
    .word-item.active.is-read .item-num {
      background: var(--accent-green); color: #ffffff;
      border-color: #15803d;
      box-shadow: 0 1px 4px rgba(22, 163, 74, 0.28);
    }

    .word-item-text { flex: 1; min-width: 0; }
    .word-item-title {
      font-size: 14px; font-weight: 600; color: var(--text-primary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .word-item.active .word-item-title { color: #991b1b; font-weight: 700; }
    .word-item-sub {
      font-size: 11.5px; color: var(--text-muted); margin-top: 1px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    .status-dots { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .ready-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--book-teal);
    }
    .answer-dot {
      width: 7px; height: 7px; border-radius: 50%;
      background: var(--accent-amber);
    }
    .fav-dot-icon {
      display: inline-flex; align-items: center; justify-content: center;
      color: #e11d48; line-height: 1;
    }

    /* 본문 영역 */
    .main-content {
      flex: 1; min-width: 0; overflow-y: auto;
      padding: 0 0 48px;
      -webkit-overflow-scrolling: touch;
      background: #ffffff;
    }
    .content-container {
      width: 100%; max-width: 100%; margin: 0;
      display: flex; flex-direction: column; gap: 0;
    }
    .page-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 12px; flex-wrap: wrap;
      padding: 14px 28px 12px;
      border-bottom: 1px solid #f1f5f9;
      background: #ffffff;
    }
    .toolbar-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .toolbar-day-pill {
      background: var(--toolbar-pill-bg); color: #ffffff; font-size: 12px;
      font-weight: 700; padding: 4px 10px; border-radius: 999px;
      transition: background-color 0.18s ease;
    }
    .toolbar-theme { font-size: 13.5px; font-weight: 600; color: var(--text-secondary); }

    .nav-prev-next { display: flex; align-items: center; gap: 6px; }
    .nav-order-btn {
      padding: 5px 10px; border-radius: 8px;
      border: 1px solid var(--border-light); background: #f8fafc;
      color: var(--text-secondary); font-size: 12.5px; font-weight: 700;
      font-family: inherit; cursor: pointer; margin-right: 2px;
      transition: all 0.14s ease;
    }
    .nav-order-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }
    .nav-order-btn.is-read {
      background: var(--accent-green); border-color: #15803d;
      color: #ffffff; box-shadow: 0 1px 4px rgba(22, 163, 74, 0.28);
    }

    .nav-btn {
      padding: 6px 12px; border-radius: 8px; border: 1px solid var(--border-light);
      background: #ffffff; color: var(--text-primary); font-size: 13px;
      font-weight: 600; font-family: inherit; cursor: pointer; box-shadow: var(--shadow-sm);
    }
    .nav-btn:hover:not(:disabled) { background: #f8fafc; border-color: #cbd5e1; }
    .nav-btn:disabled { opacity: 0.4; cursor: default; }
    .nav-btn.edit-btn { border-color: #c7d2fe; background: #eef2ff; color: #3730a3; }
    .nav-btn.today-btn { border-color: var(--book-teal-line); background: #f8fafc; color: var(--book-teal); }
    .nav-btn.today-btn:hover:not(:disabled) { background: #f1f5f9; border-color: var(--book-teal); }
    .nav-btn.list-btn { border-color: #bbf7d0; background: #f0fdf4; color: #15803d; }
    .nav-btn.list-btn:hover:not(:disabled) { background: #dcfce7; border-color: #86efac; }
    .nav-btn.fav-list-btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      padding: 6px 10px;
      border-color: #fecdd3; background: #fff1f2; color: #e11d48;
    }
    .nav-btn.fav-list-btn:hover:not(:disabled) { background: #ffe4e6; border-color: #fda4af; }
    .nav-btn.fav-list-btn .fav-btn-count {
      font-size: 11.5px; font-weight: 700; line-height: 1;
    }

    .book-page {
      --page-pad-x: 34px;
      background: #ffffff;
      border: none;
      border-radius: 0;
      padding: 0 var(--page-pad-x) 46px;
      box-shadow: none;
    }

    /* 어휘·원어 + 우측 즐겨찾기(하트) 상단 고정 + 좌측에서 우측까지 꽉 채우는 얇은 하단 줄 */
    .book-title-wrap {
      position: -webkit-sticky;
      position: sticky;
      top: 0;
      z-index: 12;
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin: 0 calc(var(--page-pad-x) * -1) 24px;
      padding: 18px var(--page-pad-x) 14px;
      background: rgba(255, 255, 255, 0.97);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border-bottom: 1px solid var(--book-teal-line);
      transition: box-shadow 0.18s ease, border-color 0.18s ease;
    }
    .book-title-wrap.is-stuck {
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.06);
    }
    .book-title-main {
      display: flex; align-items: baseline; flex-wrap: wrap; gap: 10px;
      flex: 1; min-width: 0;
    }
    .book-word-kr {
      display: inline-block; margin: 0; font-size: 30px; font-weight: 800;

    .book-essay {

    /* 오늘의 질문 + 각 질문별 자동 확장 답변 입력창 */
    .book-questions { margin-top: 40px; }
    .book-q-header { display: flex; align-items: center; gap: 12px; margin-bottom: 18px; }
    .book-q-title { margin: 0; font-size: 15.5px; font-weight: 700; color: var(--book-teal); white-space: nowrap; }
    .book-q-line { flex: 1; height: 1px; background: var(--book-teal-line); }
    .answer-save-status {
      font-size: 11.5px; font-weight: 500; color: var(--text-muted); white-space: nowrap;
    }

    .book-q-list {
      list-style: none; margin: 0; padding: 0;
      display: flex; flex-direction: column; gap: 20px;
    }
    .book-q-block {
      display: flex; flex-direction: column; gap: 8px;
    }
    .book-q-item {
      position: relative; margin: 0; padding-left: 16px; font-size: 15px;
      line-height: 1.75; color: #334155; font-weight: 500; word-break: keep-all;
    }
    .book-q-item::before {
      content: "·"; position: absolute; left: 2px; top: 0;
      font-weight: 800; color: var(--book-teal);
    }

    .answer-input-wrap {
      padding-left: 14px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .answer-input-wrap.no-indent {
      padding-left: 0;
    }
    .answer-textarea {
      display: block;
      flex: 1 1 auto;
      min-width: 0;
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px solid #d7e2df;
      background: #f8fafc;
      color: #15803d;
      font-weight: 500;
      font-size: 16px;
      font-family: inherit;
      line-height: 1.65;
      resize: none;
      overflow: hidden;
      scrollbar-width: none;
      -ms-overflow-style: none;
      white-space: pre-wrap;
      word-wrap: break-word;

      word-break: break-word;
      outline: none;
      transition: border-color 0.15s ease, background-color 0.15s ease, box-shadow 0.15s ease;
    }
    .answer-textarea.has-value {

      border-color: #bbf7d0;
    }
    .answer-textarea::-webkit-scrollbar { display: none; }
    .answer-textarea::placeholder { color: #94a3b8; font-weight: 400; }
    .answer-textarea:focus {
      background: #ffffff;
      border-color: var(--accent-green);
      box-shadow: 0 0 0 3px rgba(22, 163, 74, 0.14);
    }

    /* 답변 작성 시 우측 좋아요 아이콘 */
    .answer-like-badge {
      display: none;
      flex-shrink: 0;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--accent-blue);

    }
    @keyframes likePop {

      70% { transform: scale(1.14); opacity: 1; }
      100% { transform: scale(1); opacity: 1; }

    .answer-box-footer {

    }
    .answer-clear-btn {

      color: var(--text-secondary); font-size: 12.5px; font-weight: 600;
      font-family: inherit; cursor: pointer;
    }
    .answer-clear-btn:hover { background: #f1f5f9; }

      padding: 7px 14px; border-radius: 8px;

      color: #ffffff; font-size: 12.5px; font-weight: 600;
      font-family: inherit; cursor: pointer;

    /* 데이터 없음 상태 */

    /* 편집 폼 */
    .edit-form { display: flex; flex-direction: column; gap: 14px; margin-top: 6px; }
    .edit-field { display: flex; flex-direction: column; gap: 6px; }
    .edit-label { font-size: 12.5px; font-weight: 700; color: var(--book-teal); }
    .edit-input, .edit-textarea {
      width: 100%; padding: 10px 12px; border-radius: 9px;
      border: 1px solid #cbd5e1; background: #ffffff; color: var(--text-primary);
      font-size: 16px; font-family: inherit; line-height: 1.65; outline: none;
    }
    .edit-input:focus, .edit-textarea:focus { border-color: var(--book-teal); }
    .edit-textarea { min-height: 110px; resize: vertical; }
    .edit-textarea.essay-area { min-height: 220px; }
    .edit-footer { display: flex; justify-content: flex-end; gap: 8px; margin-top: 6px; }

    /* 설정 모달 */
    .modal-backdrop {
      display: none; position: fixed; inset: 0;
      background: rgba(15, 23, 42, 0.52);
      z-index: 50; align-items: center; justify-content: center; padding: 16px;
    }
    .modal-backdrop.open { display: flex; }

    .modal-card {
      width: 100%; max-width: 390px; background: #ffffff;
      border-radius: 16px; padding: 20px;
      box-shadow: 0 20px 44px rgba(15, 23, 42, 0.25);

    }
    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 14px;
    }
    .modal-title { margin: 0; font-size: 16px; font-weight: 800; color: var(--text-primary); }
    .modal-close {
      border: none; background: #f1f5f9; color: var(--text-secondary);
      width: 30px; height: 30px; border-radius: 8px;
      font-size: 18px; line-height: 1; cursor: pointer;
      display: inline-flex; align-items: center; justify-content: center;
    }
    .modal-close:hover { background: #e2e8f0; color: var(--text-primary); }

    .modal-status-group {
      display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px;
    }
    .modal-status {
      display: flex; align-items: center; justify-content: space-between;
      padding: 9px 12px; border-radius: 10px;
      background: #f8fafc; border: 1px solid var(--border-light);
      font-size: 13px; color: var(--text-secondary);
    }
    .modal-status strong { color: var(--text-primary); font-weight: 700; }

    .modal-actions { display: flex; flex-direction: column; gap: 9px; }
    .modal-action-btn {
      width: 100%; display: flex; flex-direction: column; align-items: flex-start; gap: 2px;
      padding: 12px 14px; border-radius: 11px; border: none;
      color: #ffffff; font-family: inherit; cursor: pointer; text-align: left;
      transition: filter 0.14s ease;
    }
    .modal-action-btn:hover { filter: brightness(1.07); }
    .modal-action-btn.btn-backup { background: var(--accent-indigo); }
    .modal-action-btn.btn-backup-all { background: #334155; }
    .modal-action-btn.btn-import { background: var(--accent-green); }
    .modal-action-title { font-size: 14px; font-weight: 700; }
    .modal-action-desc { font-size: 11.5px; opacity: 0.9; font-weight: 400; }

    /* 어휘 · 질문 · 답변 목록 모달 */
    .qa-modal-card {
      width: 100%;
      max-width: 740px;
      max-height: 86dvh;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 22px 48px rgba(15, 23, 42, 0.28);
      border: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .qa-modal-top {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border-light);
      background: #ffffff;
      flex-shrink: 0;
    }
    .qa-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 12px;
    }
    .qa-modal-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .qa-modal-count {
      font-size: 11.5px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
      white-space: nowrap;
    }
    .qa-modal-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
    }
    .qa-filter-tabs {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-wrap: wrap;
    }
    .qa-filter-btn {
      padding: 6px 11px;
      border-radius: 999px;
      border: 1px solid var(--border-light);
      background: #f8fafc;
      color: var(--text-secondary);
      font-size: 12.5px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.14s ease;
    }
    .qa-filter-btn:hover { background: #f1f5f9; border-color: #cbd5e1; }
    .qa-filter-btn.active {
      background: #15803d;
      border-color: #15803d;
      color: #ffffff;
    }
    .qa-search-wrap {
      position: relative;
      flex: 1 1 180px;
      min-width: 160px;
    }
    .qa-search-input {
      width: 100%;
      padding: 7px 28px 7px 12px;
      border-radius: 9px;
      border: 1px solid var(--border-light);
      background: #f8fafc;
      color: var(--text-primary);
      font-size: 16px;
      font-family: inherit;
      outline: none;
    }
    .qa-search-input:focus { border-color: var(--accent-green); background: #ffffff; }
    .qa-search-clear {
      position: absolute;
      right: 6px;
      top: 50%;
      transform: translateY(-50%);

      background: transparent;
      color: var(--text-muted);

    }
    .qa-modal-body {
      flex: 1;
      overflow-y: auto;

      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .qa-card {
      background: #ffffff;
      border: 1px solid var(--border-light);
      border-radius: 13px;
      padding: 16px 18px;
      box-shadow: var(--shadow-sm);
    }
    .qa-card-head {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 10px;
      margin-bottom: 11px;

    .qa-card-title-group {
      display: flex;
      flex-direction: column;

    }
    .qa-card-meta-row {

    .qa-day-badge {

    .qa-word-kr {

    }
    .qa-word-orig {
      font-size: 13px;
      font-weight: 500;
      color: var(--book-orig);
    }
    .qa-jump-btn {
      flex-shrink: 0;
      padding: 5px 10px;
      border-radius: 8px;
      border: 1px solid var(--book-teal-line);
      background: #f8fafc;
      color: var(--book-teal);
      font-size: 12px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
    }
    .qa-jump-btn:hover { background: #f1f5f9; border-color: var(--book-teal); }

    .qa-origin-box {
      margin: 0 0 13px;
      padding: 10px 12px;
      border-radius: 9px;
      background: #f8fafc;
      border-left: 3px solid var(--book-teal-line);
      font-size: 13.5px;
      line-height: 1.72;
      color: var(--book-teal-soft);
      word-break: break-all;
    }
    .qa-items {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .qa-pair {
      display: flex;
      flex-direction: column;
      gap: 5px;
    }
    .qa-question {
      position: relative;
      margin: 0;
      padding-left: 13px;
      font-size: 13.8px;
      font-weight: 600;
      line-height: 1.62;
      color: #334155;
      word-break: keep-all;
    }
    .qa-question::before {
      content: "Q.";

      left: 0;
      top: 0;
      font-size: 12px;
      font-weight: 800;
      color: var(--book-teal);
    }
    .qa-answer {
      margin: 0 0 0 12px;
      padding: 9px 12px;
      border-radius: 9px;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #15803d;
      font-size: 14px;
      font-weight: 500;
      line-height: 1.68;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .qa-answer.is-empty {
      background: #f8fafc;
      border-color: #e2e8f0;
      color: #94a3b8;
      font-size: 12.8px;
      font-weight: 400;
      padding: 6px 10px;
    }
    .qa-empty-state {
      padding: 40px 20px;
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      line-height: 1.8;
      background: #ffffff;
      border-radius: 12px;
      border: 1px dashed #cbd5e1;

    /* 즐겨찾기 모달 */
    .fav-modal-card {

      max-width: 560px;
      max-height: 84dvh;

      border-radius: 16px;
      box-shadow: 0 22px 48px rgba(15, 23, 42, 0.28);
      border: 1px solid var(--border-light);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .fav-modal-top {
      padding: 18px 20px 14px;
      border-bottom: 1px solid var(--border-light);
      background: #ffffff;
      flex-shrink: 0;
    }
    .fav-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 11px;
    }
    .fav-modal-title-wrap {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .fav-modal-title-icon {
      display: inline-flex;
      align-items: center;
      color: #e11d48;
    }
    .fav-modal-count {
      font-size: 11.5px;
      font-weight: 700;
      padding: 2px 9px;
      border-radius: 999px;
      background: #fff1f2;
      color: #e11d48;
      border: 1px solid #fecdd3;
      white-space: nowrap;
    }
    .fav-modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 14px 18px 20px;
      background: #f8fafc;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .fav-item-card {

    .fav-item-orig {
      font-size: 12.5px;

    /* 토스트 */
    .toast {
      position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px);
      background: #0f172a; color: #ffffff; padding: 10px 18px; border-radius: 999px;
      font-size: 13.5px; font-weight: 600; opacity: 0; pointer-events: none;
      transition: all 0.22s ease; z-index: 60; box-shadow: 0 8px 20px rgba(15, 23, 42, 0.28);
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* 중소형 태블릿 세로 화면 보정 (741px ~ 920px) */
    @media (max-width: 920px) and (min-width: 741px) {
      :root { --sidebar-width: 240px; }
      .page-toolbar { padding: 12px 20px 10px; }
      .book-page { --page-pad-x: 24px; padding: 0 var(--page-pad-x) 40px; }
      .book-title-wrap { padding: 16px var(--page-pad-x) 13px; }
      .book-word-kr { font-size: 27px; }
      .book-word-orig { font-size: 15px; }
    }

    /* 모바일 전용 반응형 (<= 740px): 목록 아이콘 클릭 시 좌측 드로어로 사이드바 표시 */
    @media (max-width: 740px) {
      .cat-tabs-strip { padding: 6px 12px 0 12px; gap: 5px; }
      .cat-tab {
        flex: 1 1 0;
        min-width: 0;
        padding: 8px 6px 7px;
        font-size: 13.5px;
        border-radius: 10px 10px 0 0;
      }
      .cat-tab.active {
        padding-top: 9px;
        padding-bottom: 9px;
      }
      .cat-tab.active::before,
      .cat-tab.active::after {
        width: 9px;
        height: 9px;
      }
      .cat-tab.active::before {
        left: -9px;
        background: radial-gradient(circle at 0 0, transparent 8.6px, var(--tab-bg) 9px);
      }
      .cat-tab.active::after {
        right: -9px;
        background: radial-gradient(circle at 100% 0, transparent 8.6px, var(--tab-bg) 9px);

at": [["세이보링", "Savoring"], ["몰입", "Flow"], ["피카", "Fika"], ["돌체 파르 니엔테", "Dolce far niente"], ["주아 드 비브르", "Joie de vivre"], ["우테필스", "Utepils"], ["코슬리그", "Koselig"], ["게뮈틀리히카이트", "Gemütlichkeit"], ["소확행", "小確幸"], ["세렌디피티", "Serendipity"], ["글리머", "Glimmer"], ["유다이모니아", "Eudaimonia"], ["프리송", "Frisson"], ["유희성", "Playfulness"], ["메리키", "Meraki"], ["프릴루프트슬리브", "Friluftsliv"], ["소브레메사", "Sobremesa"], ["니크센", "Niksen"], ["포어프로이데", "Vorfreude"], ["무디타", "Mudita"], ["심미안", "審美眼"], ["리추얼", "Ritual"], ["감사성", "Gratitude"], ["경외감", "Awe"], ["윤슬", "순우리말"], ["다감", "多感"], ["유유자적", "悠悠自適"], ["아프리시티", "Apricity"], ["페트리코", "Petrichor"], ["충만감", "Fulfillment"], ["슬로우 라이프", "Slow Life"], ["오감 향유", "Sensory Pleasure"], ["나만의 아지트", "Personal Sanctuary"], ["자기 데이트", "Solo Date"], ["사소한 사치", "Little Luxury"], ["무목적 산책", "Aimless Stroll"], ["키라키라", "キラキラ"], ["하쿠나 마타타", "Hakuna Matata"], ["콘비비알리테", "Convivialité"], ["조이풀 마인드", "Joyful Mind"], ["유머 감각", "Sense of Humor"], ["창조적 유희", "Creative Play"], ["미식적 호기심", "Culinary Delight"], ["감각적 여백", "Sensory Pause"], ["호젓함", "순우리말"], ["오롯함", "순우리말"], ["나른함", "순우리말"], ["소담함", "순우리말"], ["아기자기함", "순우리말"], ["흥취", "興趣"], ["안빈낙도", "安貧樂道"], ["포근함", "순우리말"]]}, "starters": {"sun-01": {"origin": "펜실베이니아 대학교 와튼 스쿨의 행동경제학자 헝첸 다이, 캐서린 밀크먼 등이 제시한 개념으로, 새해나 월요일, 생일처럼 시간적 이정표가 되는 시점에 사람들이 과거의 실패와 자신을 분리하고 새 목표를 추구하려는 동기가 강해지는 현상을 말한다.", "quote": "“모든 아침은 어제의 실수를 덮고 새 문장을 쓰기에 충분한 백지다.”", "author": "랄프 왈도 에머슨", "essay": "우리는 흔히 무언가를 잘못했거나 계획이 틀어졌을 때, 그 실수의 흔적이 마치 지워지지 않는 얼룩처럼 앞으로의 시간까지 영원히 따라다닐 것 같은 무력감에 빠지곤 합니다. 한 번 리듬이 무너지면 '이미 늦었어'라며 남은 하루와 한 주 전체를 통째로 포기해 버리는 일도 잦습니다. 하지만 달력의 숫자가 바뀌거나 한 주가 새로 열리는 일요일 저녁, 혹은 계절의 첫날이 다가오면 신기하게도 마음 한편에 맑은 여백이 생겨납니다. 심리학에서는 이를 시간적 경계가 만들어 내는 심리적 분리 효과라고 부릅니다.\n\n이 효과가 강력한 이유는 단순히 기분이 좋아져서가 아니라, '실수했던 어제의 나'와 '다시 시작하는 오늘의 나' 사이에 분명한 선을 그어 주기 때문입니다. 과거의 아쉬움을 지금의 내 정체성과 분리해 내면, 자책에 묶여 있던 에너지가 비로소 미래를 향한 작은 실행력으로 옮겨 가게 됩니다. 우리는 매번 완전히 다른 사람이 될 필요가 없습니다. 그저 어제의 실패를 어제의 페이지에 조용히 접어 두고 새 장을 펼칠 작은 계기만 있으면 충분합니다.\n\n거창한 새해 첫날이나 생일을 기다릴 필요는 없습니다. 오늘 아침 창문을 열어 환기하는 순간, 따뜻한 커피 한 잔을 마신 뒤, 혹은 지금 이 문장을 읽고 덮는 바로 이 찰나를 나만의 작은 이정표로 삼아 보세요. 지나간 아쉬움은 어제의 나에게 다정히 건네주고, 지금 여기에서 다시 첫 줄을 써 내려갈 권리는 언제나 온전히 나의 손안에 있습니다.", "questions": ["과거의 아쉬움과 조용히 작별하고 새로 시작하고 싶은 습관이나 일이 있나요?", "이번 한 주를 나만의 '신선한 시작점'으로 만들기 위해 오늘 저녁 할 수 있는 작은 의식은 무엇인가요?", "예전의 나에게서 덜어내고 지금의 나에게 새로 초대하고 싶은 마음가짐은 무엇인가요?"]}, "mon-01": {"origin": "사회심리학자 아리에 크루글란스키가 제시한 개념으로, 모호하고 불확실한 상태를 견디기 어려워해 정답이 완벽하지 않더라도 하루빨리 어떤 결론이든 확정 짓고 싶어 하는 강한 심리적 욕구를 뜻한다.", "quote": "“성급한 확신은 불안을 잠시 잠재워 주지만, 때로는 가장 좋은 가능성을 닫아 버린다.”", "author": "아리에 크루글란스키", "essay": "결과가 아직 나오지 않은 일을 기다리거나 상대방의 속마음이 애매하게 느껴질 때, 우리는 그 모호한 공백을 견디지 못해 안절부절못하곤 합니다. '차라리 안 될 거면 빨리 안 된다고 말해 줬으면 좋겠다'는 생각이 들 만큼 불확실성 자체가 큰 고통으로 다가옵니다. 심리학에서는 이처럼 어떤 답이든 빨리 못 박고 싶어 하는 마음을 '인지적 종결 욕구'라고 부릅니다.\n\n문제는 이 욕구가 강하게 작동할수록 우리가 충분한 정보를 살피기도 전에 성급하게 부정적인 결론을 내려 버린다는 데 있습니다. 상대의 답장이 조금 늦을 뿐인데 '나에게 화가 났나 봐'라고 단정 짓고, 아직 시도도 끝나지 않은 일을 '이번엔 틀렸어'라고 서둘러 덮어 버립니다. 당장의 답답함은 잠깐 줄어드는 것 같지만, 사실은 스스로를 좁은 오해 속에 가두는 셈이 됩니다.\n\n삶에는 오늘 당장 흑백으로 갈라지지 않고 시간이 지나야 비로소 윤곽이 드러나는 일들이 훨씬 많습니다. 불확실함이 밀려올 때 성급히 마침표를 찍는 대신, '아직은 모르는 상태로 하루만 더 두어 보자'고 마음에 작은 여백을 허락해 보세요. 모호함을 견디는 힘이야말로 불안을 다스리는 가장 성숙한 여유입니다.", "questions": ["최근에 모호한 상태를 견디기 힘들어 성급하게 부정적인 결론을 내려 버린 일이 있나요?", "지금 당장 답을 확정 짓지 않고 '며칠만 더 지켜보자'고 유보해 둘 수 있는 고민은 무엇인가요?", "시간이 조금 지난 뒤에야 오해가 풀리거나 생각보다 좋은 결론으로 이어졌던 경험이 있나요?"]}, "tue-01": {"origin": "심리상담과 가족치료에서 핵심적으로 다루는 개념으로, 나와 타인의 감정·책임·욕구가 어디까지 내 몫이고 어디부터 상대의 몫인지를 구분하는 보이지 않는 마음의 울타리를 뜻한다.", "quote": "“건강한 경계선은 상대를 밀어내는 차가운 벽이 아니라, 내가 상대를 계속 사랑할 수 있게 돕는 문이다.”", "author": "네드라 글로버 타왑", "essay": "우리는 흔히 가까운 사이일수록 모든 감정과 생각을 남김없이 공유하고, 상대가 슬프면 나도 함께 무너져야 진정한 사랑이나 우정이라고 믿곤 합니다. 하지만 나와 타인 사이의 경계가 흐려지면, 상대의 짜증이 곧 내 잘못처럼 느껴지고 상대의 기분에 따라 내 하루 전체가 휘둘리게 됩니다. 결국 상대에게 맞추느라 지쳐 버린 마음이 원망으로 바뀌며 관계마저 상처를 입습니다.\n\n정서적 경계선은 남을 배척하거나 이기적으로 구는 담장이 아닙니다. 오히려 '여기까지는 내가 기꺼이 도울 수 있지만, 여기서부터는 당신이 스스로 감당해야 할 감정과 선택이야'라고 부드럽게 구분해 주는 건강한 울타리입니다. 집마다 현관문이 있어야 안전하게 손님을 초대할 수 있듯, 마음에도 분명한 경계가 있어야 타인을 진심으로 환대하고 오래 아낄 수 있습니다.\n\n누군가의 감정이 내 안으로 너무 깊이 밀려들어 숨이 막힌다면 잠시 한 걸음 물러나 조용히 되뇌어 보세요. '저 사람의 화와 불안은 저 사람의 몫이고, 나는 내 마음의 평온을 지킬 권리가 있다.' 경계를 세우는 일은 관계를 끊는 것이 아니라 더 오래 지키기 위한 다정한 기술입니다.", "questions": ["가까운 사람의 기분이나 감정을 내 책임처럼 떠안아 마음이 무거워졌던 최근의 순간은 언제인가요?", "지금 내 인간관계 중 조금 더 분명하고 부드럽게 세우고 싶은 '정서적 경계선'은 어디인가요?", "상대방에게 상처를 주지 않으면서도 내 한계를 솔직하게 전할 수 있는 다정한 문장은 무엇일까요?"]}, "wed-01": {"origin": "심리학에서 문제 해결이나 성찰의 범위를 넘어, 이미 지나간 실수를 끝없이 되감거나 일어나지 않은 미래의 변수들을 반복적으로 곱씹으며 뇌와 감정을 탈진시키는 사고 과부하 상태를 말한다.", "quote": "“생각은 우리를 돕는 훌륭한 도구이지만, 주인을 잠 못 들게 할 때는 이미 도구가 아니라 족쇄다.”", "author": "수전 놀렌-혹세마", "essay": "낮에는 바쁜 일정에 밀려 잠잠하던 생각들이, 유독 불을 끄고 침대에 눕는 순간 한꺼번에 고개를 쳐들곤 합니다. 아까 회의에서 했던 짧은 말투, 아직 오지 않은 다음 주 일정, 몇 달 전의 사소한 실수까지 머릿속에서 쉴 새 없이 재생됩니다. 우리는 생각을 많이 할수록 더 나은 해결책이 나올 것이라 믿지만, 밤의 과잉 사고는 문제를 풀기보다 불안의 부피만 부풀릴 뿐입니다.\n\n심리학자 수전 놀렌-혹세마는 건강한 성찰과 과잉 사고의 차이를 '해결로의 이동 여부'에서 찾았습니다. 건강한 생각은 작은 행동 계획으로 이어지며 마음이 정리되지만, 과잉 사고는 같은 자리만 빙글빙글 맴돌며 점점 무력감과 자책을 깊게 만듭니다. 밤의 뇌는 피로해져 이성적 판단력이 떨어지므로, 밤에 내린 비관적 결론은 대개 사실보다 훨씬 어둡게 채색됩니다.\n\n머릿속 생각이 꼬리에 꼬리를 물고 멈추지 않을 때는 '지금은 해결의 시간이 아니라 휴식의 시간'이라고 조용히 선언해 주세요. 떠오르는 고민을 메모지에 단 세 줄로 적어 내려놓고 '내일 오전 10시에 다시 보자'며 책상 위에 두고 돌아설 때, 비로소 밤의 평온이 돌아옵니다.", "questions": ["유독 잠자리에 누웠을 때 내 머릿속을 가장 자주 찾아와 맴도는 단골 고민은 무엇인가요?", "그 생각은 실제로 문제 해결에 도움이 되고 있나요, 아니면 같은 자리만 맴돌며 에너지만 소모하고 있나요?", "오늘 밤 떠오르는 생각 중 내일 아침으로 미루어 두고 잠시 덮어 놓을 수 있는 고민 하나는 무엇인가요?"]}, "thu-01": {"origin": "라틴어 'gravis(무겁다, 슬프다)'에서 유래한 단어로, 사랑하는 사람과의 이별뿐 아니라 끝난 관계, 잃어버린 건강, 이루지 못한 꿈과 지나간 시절을 충분히 슬퍼하고 떠나보내는 건강한 마음의 치유 과정을 뜻한다.", "quote": "“충분히 슬퍼할 시간을 허락받은 상실만이, 마침내 따뜻한 기억으로 남아 다시 삶을 걷게 한다.”", "author": "엘리자베스 퀴블러 로스", "essay": "우리는 흔히 상실이나 이별을 겪은 사람에게 '이제 그만 잊고 힘내'라고 서둘러 위로하곤 합니다. 나 자신에게도 '언제까지 슬퍼하고 있을 거야, 빨리 털고 일어나야지'라며 아픔을 재촉할 때가 많습니다. 하지만 슬픔은 서둘러 덮어 둔다고 사라지지 않고, 오히려 충분히 울고 떠나보내지 못한 애도는 마음 깊은 곳에 얼어붙은 덩어리로 남아 오래도록 우리를 붙잡습니다.\n\n심리학에서 말하는 '애도'는 반드시 죽음 앞에서의 슬픔만을 뜻하지 않습니다. 간절히 원했던 기회의 무산, 멀어져 버린 소중한 우정, 예전 같지 않은 체력과 흘러간 청춘을 향해 '그동안 참 고마웠고, 이제는 정말 보내 주어야 해서 아프구나'라고 정직하게 고백하는 모든 과정이 애도입니다.\n\n슬픔은 사랑이 머물렀던 자리에 남는 가장 진실한 흔적입니다. 오늘 마음 한구석에 아직 매듭짓지 못한 상실이 남아 있다면, 억지로 씩씩해지려 애쓰지 마세요. 아픈 만큼 조용히 슬퍼하고 충분히 작별 인사를 건넬 때, 비로소 마음은 상실을 끌어안은 채 다시 다음 계절로 걸어 나갈 힘을 얻습니다.", "questions": ["아직 충분히 슬퍼하거나 작별 인사를 건네지 못한 채 마음 한구석에 묻어 둔 상실이나 아쉬움이 있나요?", "슬픔을 빨리 털어 내야 한다는 조급함을 잠시 내려놓고, 그 아픔에 다정히 건네주고 싶은 말은 무엇인가요?", "지나간 소중한 인연이나 시절을 따뜻한 기억으로 남기기 위해 나만의 작은 애도의 의식을 한다면 어떤 모습일까요?"]}, "fri-01": {"origin": "라틴어 'resilire(다시 튀어 오르다)'에서 유래한 심리학 개념으로, 원래는 외부의 압력으로 구부러진 물체가 본래의 모양으로 되돌아가는 탄성을 뜻했다. 시련과 역경 앞에서 무너지지 않는 단단함뿐 아니라, 넘어졌을 때 바닥을 딛고 이전보다 더 단단하게 다시 튀어 오르는 마음의 탄력을 말한다.", "quote": "“강한 대나무는 바람에 부러지지 않기 위해 버티는 것이 아니라, 휘어졌다가 다시 일어서는 탄력을 품고 있다.”", "author": "앤 마스텐", "essay": "우리는 흔히 마음이 강한 사람이라고 하면 어떤 충격에도 끄떡없이 단단한 바위 같은 모습을 떠올리곤 합니다. 하지만 정작 거센 폭풍이 몰아치면, 유연함 없이 딱딱하게 버티기만 하는 나무가 가장 먼저 부러지고 맙니다. 진정한 마음의 힘인 '회복탄력성'은 결코 상처받지 않는 무적의 상태가 아니라, 아프면 아픈 대로 잠시 휘어졌다가도 결국 제자리로 다시 튀어 오르는 탄력에 있습니다.\n\n심리학자 앤 마스텐은 회복탄력성을 특별한 영웅들만 타고나는 기적이 아니라, 평범한 일상의 돌봄과 관계 속에서 누구나 기를 수 있는 '일상의 마법'이라고 불렀습니다. 넘어졌을 때 '나는 끝났어'라며 바닥에 주저앉아 자책하는 대신, 무릎의 먼지를 털고 '이번엔 여기서 무엇을 배웠지?'라고 물어보는 그 작은 시선 전환이 바로 튀어 오르는 첫 번째 반동이 됩니다.\n\n오늘 혹시 마음이 조금 휘어지고 바닥 가까이 내려앉아 있더라도 실망하지 마세요. 공이 바닥에 닿아야 비로소 위로 튀어 오를 수 있듯, 지금 당신이 딛고 선 그 바닥이야말로 다시 힘차게 일어설 가장 단단한 출발점입니다.", "questions": ["과거에 크게 넘어졌거나 휘어졌지만 끝내 다시 튀어 올라 제자리를 찾았던 나만의 회복 경험은 무엇인가요?", "지금 나를 바닥으로 끌어내리고 있는 시련 앞에서, '부러짐'이 아닌 '잠시 휘어짐'으로 바라본다면 어떤 마음이 드나요?", "내 안의 회복탄력성을 다시 깨우기 위해 오늘 바로 바닥을 딛고 해 볼 수 있는 작은 움직임은 무엇인가요?"]}, "sat-01": {"origin": "긍정심리학자 프레드 브라이언트와 조셉 베로프가 정립한 개념으로, 라틴어 'sapere(맛보다)'에서 유래했다. 좋은 순간을 그저 스쳐 지나보내지 않고 오감을 열어 천천히 음미하고 기억 속에 오래 머물게 하여 행복의 밀도를 깊게 만드는 마음의 기술이다.", "quote": "“행복은 거대한 사건의 횟수가 아니라, 지금 눈앞의 작은 기쁨을 얼마나 깊이 맛보느냐로 결정된다.”", "author": "프레드 브라이언트", "essay": "우리는 나쁜 일이 생기면 며칠 밤을 새워 가며 곱씹고 분석하는 데는 참 능숙하지만, 정작 기분 좋은 순간이 찾아오면 '좋았네!' 하고 단 몇 초 만에 다음 일정으로 넘어가 버리곤 합니다. 멋진 풍경 앞에서 사진만 서둘러 찍고 정작 눈으로는 제대로 바라보지 못한 채 자리를 뜨는 일도 잦습니다. 긍정심리학에서는 이처럼 흘러가기 쉬운 기쁨을 의식적으로 붙잡아 천천히 음미하는 태도를 '세이보링(Savoring)'이라고 부릅니다.\n\n세이보링은 대단한 사건이 있어야만 할 수 있는 일이 아닙니다. 토요일 아침 갓 구운 빵의 고소한 향기를 코끝으로 깊이 들이마시는 5초, 햇살이 따뜻하게 내려앉은 창가에서 차 한 모금을 천천히 굴려 맛보는 순간, 사랑하는 이의 웃음소리를 마음속에 조용히 저장하는 태도가 모두 세이보링입니다.\n\n기쁨은 음미할수록 오래 남고, 기억의 서랍에 선명하게 쌓여 훗날 힘든 날 나를 지켜 주는 따뜻한 양식이 됩니다. 오늘 마주친 작고 좋은 순간 하나를 서둘러 넘기지 말고, 눈을 한 번 감았다 뜨며 온몸으로 천천히 맛보아 보세요.", "questions": ["최근 일주일 동안 서둘러 지나쳤지만, 조금 더 천천히 음미(세이보링)했더라면 좋았을 기분 좋은 순간은 언제였나요?", "오늘 하루 중 오감을 활짝 열어 10초 이상 깊이 맛보고 싶은 작은 즐거움(음식, 풍경, 향기, 소리 등)은 무엇인가요?", "기억의 서랍에 꺼내어 다시 음미할 때마다 미소가 지어지는 나만의 소중한 행복의 장면은 무엇인가요?"]}}}, "emotion": {"key": "emotion", "label": "감정", "fullTitle": "감정 단어 52주", "unit": "감정", "itemLabel": "감정 단어", "dataDir": "emotion_data", "globalVars": ["EMOTION_VOCAB_DATA"], "jsonFilename": "emotion-vocab-364.json", "backupPrefix": "emotion-vocab-backup-", "originPlaceholder": "감정의 어원과 핵심 개념을 입력하세요.", "storageKeys": {"essays": "emotion_vocab_52_essays_v1", "answers": "emotion_vocab_52_answers_v1", "read": "emotion_vocab_52_read_v1", "favorites": "emotion_vocab_52_favorites_v1"}, "daysMeta": [{"key": "sun", "short": "일", "name": "일요일", "sub": "기쁨·설렘", "theme": "마음을 환하게 밝히는 기쁨의 감정들"}, {"key": "mon", "short": "월", "name": "월요일", "sub": "불안·긴장", "theme": "흔들리고 조마조마한 불안의 감정들"}, {"key": "tue", "short": "화", "name": "화요일", "sub": "분노·서운", "theme": "뜨겁게 치밀고 날이 서는 분노의 감정들"}, {"key": "wed", "short": "수", "name": "수요일", "sub": "슬픔·외로움", "theme": "고요히 젖어 들고 그리워하는 슬픔의 감정들"}, {"key": "thu", "short": "목", "name": "목요일", "sub": "부끄럼·자책", "theme": "얼굴이 붉어지고 스스로를 돌아보는 감정들"}, {"key": "fri", "short": "금", "name": "금요일", "sub": "용기·다짐", "theme": "다시 고개를 들고 나아가는 힘의 감정들"}, {"key": "sat", "short": "토", "name": "토요일", "sub": "평온·사랑", "theme": "마음을 포근히 감싸 안는 평온과 사랑의 감정들"}], "vocabList": {"sun": [["기쁨", "Joy"], ["설렘", "Fluttering Excitement"], ["벅참", "Overwhelming Joy"], ["뿌듯함", "Quiet Pride"], ["흐뭇함", "Heartwarming Satisfaction"], ["후련함", "Refreshing Relief"], ["상쾌함", "Crisp Freshness"], ["경쾌함", "Lightheartedness"], ["반가움", "Gladness of Meeting"], ["들뜸", "Buoyant Excitement"], ["짜릿함", "Thrill"], ["황홀함", "Rapture"], ["환희", "歡喜 · Ecstasy"], ["희열", "喜悅 · Exultation"], ["감격", "感激 · Deeply Moved"], ["보람", "Sense of Worth"], ["통쾌함", "Exhilaration"], ["뭉클함", "Touch 다정함", "Affectionate Kindness"], ["정겨움", "Homey Fondness"], ["친근함", "Friendliness"], ["푸근함", "Generous Warmth"], ["너그러움", "Magnanimity"], ["관대함", "Generosity"], ["안도감", "Relief"], ["안심", "安心 · Peace of Mind"], ["안온함", "安穩 · Sheltered Calm"], ["고즈넉함", "Quiet Serenity"], ["신뢰감", "Deep Trust"], ["사랑스러움", "Adorableness"], ["애정", "愛情 · Affection"], ["연모", "戀慕 · Romantic Devotion"], ["흠모", "欽慕 · Reverent Love"], ["호감", "Fondness"], ["끌림", "Attraction"], ["다감함", "Tender Sensitivity"], ["고마움", "Thankfulness"], ["감사함", "Gratitude"], ["황송함", "Humbled Gratitude"], ["경외감", "Awe"], ["경탄", "驚歎 · Reverent Wonder"], ["감동", "感動 · Deeply Touched"], ["존경심", "Respect"], ["경의", "敬意 · Reverence"], ["연민", "憐憫 · Compassion"], ["측은함", "Tender Pity"], ["애처로움", "Heartfelt Sympathy"], ["짠함", "Touching Compassion"], ["안쓰러움", "Aching Sympathy"], ["가여움", "Gentle Pity"], ["공감", "共感 · Empathy"], ["동질감", "Kinship"], ["유대감", "Bonding"], ["소속감", "Belonging"], ["친밀감", "Intimacy"], ["평화로움", "Peacefulness"], ["온전함", "Wholeness"]]}, "starters": {"sun-01": {"origin": "마음에 바라고 소중히 여기던 일이 이루어지거나 뜻밖의 좋은 순간을 만났을 때, 가슴속에서 밝고 가볍게 번져 나가는 가장 기본적이고 맑은 긍정 감정이다. 순우리말 '기쁘다'는 옛말 '깃브다'에서 왔으며 마음이 환히 열리고 활짝 펴지는 감각을 담고 있다.", "quote": "“기쁨은 조건이 완벽해질 때 찾아오는 보상이 아니라, 작은 빛을 알아보는 눈이 켜질 때 피어나는 감정이다.”", "author": "브레네 브라운", "essay": "우리는 흔히 아주 크고 특별한 성공을 거두어야만 비로소 '기쁨'을 느껴도 된다고 생각합니다. 그래서 평범한 하루 속에서 스쳐 가는 작은 미소와 가벼운 설렘은 대수롭지 않게 흘려보낸 채, 먼 미래의 거대한 행복만을 기다리며 오늘을 무겁게 건너곤 합니다. 하지만 기쁨의 본래 결은 화려한 폭죽보다 잔잔하게 가슴을 덥히는 햇살에 훨씬 더 가깝습니다.\n\n심리학에서는 기쁨을 느낄 때 우리 몸의 시야가 넓어지고, 경직되었던 사고가 유연해지며, 타인에게 마음을 열 수 있는 여유가 자라난다고 말합니다. 기쁨은 단순히 기분이 좋아지는 순간적 감정이 아니라, 앞으로의 고단한 날들을 버텨 내게 해 주는 가장 맑은 내면의 에너지입니다.\n\n오늘 하루를 천천히 둘러보며 내 입꼬리를 아주 살짝이라도 올라가게 만든 순간을 하나만 붙잡아 보세요. 맛있는 한 끼, 반가운 안부, 맑은 하늘빛처럼 소박한 기쁨을 제 이름으로 불러 주는 순간, 평범한 일요일도 환하게 빛나기 시작합니다.", "questions": ["최근에 아주 작지만 내 마음을 환하게 밝혀 주었던 '기쁨'의 순간은 언제였나요?", "기쁨이 찾아왔을 때 내 몸의 감각(표정, 호흡, 어깨, 발걸음 등)은 어떻게 달라지나요?", "오늘 하루가 지나가기 전에 내가 직접 초대해 보고 싶은 소박한 기쁨 한 가지는 무엇인가요?"]}, "mon-01": {"origin": "'아니 불(不)'과 '편안할 안(安)'이 합쳐진 말로, 아직 일어나지 않은 미래의 불확실성이나 잠재적 위험 앞에서 마음이 편안히 자리 잡지 못하고 흔들리며 경계하는 자연스러운 정서 신호다.", "quote": "“불안은 나를 망가뜨리려는 적이 아니라, 내가 소중히 여기는 것을 지키라고 미리 불을 켜 주는 경보등이다.”", "author": "롤로 메이", "essay": "월요일 아침이 다가오거나 새로운 책임을 마주할 때, 가슴 한쪽이 조여 오고 머릿속이 분주해지며 '불안'이 고개를 듭니다. 우리는 불안이 찾아오면 당장 없애야 할 고장이나 약함의 증거처럼 여기며 서둘러 밀어내려 애씁니다. 하지만 불안을 억지로 억누를수록 오히려 '불안해하면 안 되는데 왜 자꾸 떨리지?'라는 이중의 긴장만 커집니다.\n\n사실 불안은 인간이 위험을 미리 살피고 준비할 수 있도록 진화가 심어 둔 가장 충실한 보호 장치입니다. 내가 아무것도 아끼지 않는 일에는 불안조차 느끼지 않습니다. 지금 불안하다는 것은 그 일과 그 관계, 그리고 나의 내일이 나에게 그만큼 소중하다는 정직한 고백이기도 합니다.\n\n불안이 마음을 흔들 때는 싸워 이기려 들지 말고, 조용히 이름을 불러 앉혀 보세요. '아, 지금 내 안에 불안이 찾아와서 미리 챙겨 보라고 신호를 보내는구나.' 감정에 정확한 이름을 붙이고 지금 내가 할 수 있는 작은 준비 하나를 고르는 순간, 막연하던 불안은 다룰 수 있는 차분한 주의력으로 바뀝니다.", "questions": ["지금 내 마음속에 올라와 있는 '불안'은 내가 소중히 여기는 어떤 가치를 지키려 신호를 보내고 있나요?", "불안이 찾아올 때 내 몸과 생각에는 주로 어떤 첫 신호가 나타나나요?", "막연한 불안을 잠재우기 위해 오늘 내가 바로 할 수 있는 작고 현실적인 준비 한 가지는 무엇인가요?"]}, "tue-01": {"origin": "마음의 경계가 침범당했거나 부당함, 무시, 좌절을 겪었을 때 몸속에 뜨거운 에너지가 솟구쳐 오르며 '이건 옳지 않아, 나를 지켜야 해'라고 외치는 강렬한 보호 감정이다.", "quote": "“화남은 나쁜 성격의 증거가 아니라, 내 안의 소중한 경계가 밟혔음을 알려 주는 정직한 신호다.”", "author": "해리엇 러너", "essay": "우리는 어릴 때부터 화를 내는 것은 미성숙하고 나쁜 일이라고 배워 왔습니다. 그래서 누군가의 무례한 말에 가슴이 뜨겁게 달아올라도 억지로 웃으며 삼키거나, 반대로 참다못해 한꺼번에 터뜨린 뒤 깊은 후회와 죄책감에 빠지곤 합니다. 하지만 심리학에서 '화남' 자체는 결코 나쁜 감정이 아닙니다. 화는 내 존엄과 경계가 침범당했을 때 나를 보호하기 위해 켜지는 가장 정직한 경보입니다.\n\n문제가 되는 것은 화라는 감정 자체가 아니라, 화가 올라온 순간에 감정을 제대로 들여다보지 못한 채 공격적인 말로 폭발하거나 속으로만 곪아 버리는 표현 방식입니다. 가만히 화의 바닥을 들여다보면 그 아래에는 대개 '존중받고 싶었다', '이해받고 싶었다', '지쳐서 쉬고 싶었다'는 여리고 진실한 욕구가 숨어 있습니다.\n\n화남이 올라올 때는 3초만 숨을 고르며 '내가 지금 무엇을 지켜 내고 싶어서 이렇게 화가 났을까?' 하고 물어보세요. 화의 뜨거운 에너지를 상대를 해치는 창이 아니라, 내 경계를 단단하고 정중하게 알리는 힘으로 쓸 때 관계도 나 자신도 함께 지켜집니다.", "questions": ["최근에 '화남'이 올라왔던 순간, 그 뜨거운 감정 아래 숨어 있던 나의 진짜 욕구(존중, 공정, 배려 등)는 무엇이었나요?", "화가 났을 때 나는 주로 꾹 참는 편인가요, 아니면 바로 표현하고 나서 후회하는 편인가요?", "상대를 공격하지 않으면서도 내가 화가 난 이유와 경계를 차분하게 전하는 문장을 적어 볼까요?"]}, "wed-01": {"origin": "소중한 사람, 시간, 기대, 혹은 무언가를 잃었거나 마음의 빈자리를 마주했을 때, 에너지를 안으로 거두어들이며 상실을 애도하고 마음을 돌보게 만드는 깊고 고요한 감정이다.", "quote": "“슬픔은 사랑이 머물렀던 자리에 남는 가장 진실한 흔적이며, 마음이 치유를 시작하는 첫 숨결이다.”", "author": "칼릴 지브란", "essay": "늘 밝고 활기찬 모습만 환영받는 세상에서 '슬픔'은 빨리 털어 내고 감추어야 할 무거운 감정처럼 취급받곤 합니다. 그래서 가슴이 젖어 드는 날에도 '울면 안 돼, 얼른 기분 전환해야지'라며 서둘러 슬픔을 밀어내려 합니다. 하지만 영화 《인사이드 아웃》이 따뜻하게 보여 주었듯, 슬픔에는 기쁨조차 대신할 수 없는 고유하고 깊은 치유의 역할이 있습니다.\n\n슬픔은 바쁘게 달리던 삶의 속도를 잠시 멈추게 하고, 내가 무엇을 그토록 아끼고 사랑했는지 돌아보게 합니다. 또한 솔직하게 슬퍼하며 눈물을 흘릴 때 우리 몸은 긴장을 풀고, 주변의 다정한 위로와 연결을 받아들일 마음의 문을 엽니다. 충분히 슬퍼할 시간을 허락받은 아픔만이 비로소 건강한 기억으로 정리되어 다음 계절로 건너갈 수 있습니다.\n\n오늘 가슴 한편이 조금 무겁고 슬프다면 억지로 웃으려 애쓰지 마세요. 따뜻한 차 한 잔을 곁에 두고 '내가 이만큼 진심이었기에 지금 슬픈 거구나' 하며 가만히 곁에 앉아 주는 것만으로 마음은 천천히 숨을 고릅니다.", "questions": ["최근에 '빨리 털어 내야 해'라며 충분히 느끼지 못하고 급하게 덮어 두었던 슬픔이 있나요?", "내 안의 슬픔이 나에게 '네가 정말 소중히 여기고 사랑했던 것은 이것이야'라고 말해 주는 대상은 무엇인가요?", "슬픈 마음이 찾아왔을 때 억지로 기분을 바꾸기보다 다정하게 머물러 줄 수 있는 나만의 위로 방법은 무엇인가요?"]}, "thu-01": {"origin": "자신의 부족함이나 실수, 서툰 모습이 타인이나 스스로의 기준 앞에 드러났을 때 얼굴이 달아오르며 몸을 숨기고 싶어지는 자기 의식적 감정이다. 지나치면 위축되지만, 건강하게 마주하면 겸손과 성장의 거울이 된다.", "quote": "“부끄러움은 침묵과 어둠 속에서 자라지만, 다정한 이해와 빛 아래 꺼내 놓으면 힘을 잃는다.”", "author": "브레네 브라운", "essay": "별것 아닌 말실수를 했거나, 남들 앞에서 서툰 모습이 들통났을 때 순식간에 귀 끝이 뜨거워지며 그 자리에서 사라지고 싶은 '부끄러움'이 밀려옵니다. 부끄러움이 유독 쓰라린 이유는 단순히 '내가 실수를 했다'는 사실에 머물지 않고, 어느새 '나는 부족하고 사랑받을 자격이 없는 사람인가 봐'라는 존재 전체에 대한 위축으로 번지기 쉽기 때문입니다.\n\n하지만 감정을 연구한 브레네 브라운은 행동의 실수('내가 실수했어')와 존재의 가치('나는 못난 사람이야')를 분리해 바라보는 순간, 부끄러움은 나를 파괴하는 독이 아니라 더 성숙해지게 돕는 정직한 거울로 바뀐다고 말합니다. 세상에 단 한 번도 부끄러운 순간 없이 완벽하게 자란 어른은 아무도 없습니다.\n\n오늘 문득 얼굴이 화끈거리는 기억이 떠올랐다면, 어둠 속에 혼자 숨어 스스로를 채찍질하지 마세요. '그때는 내가 조금 서툴렀지, 그럴 수도 있어'라며 인간다운 실수를 너그럽게 안아 줄 때, 부끄러움은 비로소 맑은 겸손과 단단한 용기로 바뀝니다.", "questions": ["최근에 얼굴이 화끈거리거나 숨고 싶을 만큼 '부끄러움'을 느꼈던 순간은 언제였나요?", "그 기억 속에서 '행동의 작은 실수'와 '나라는 사람의 가치'를 나누어 바라보면 어떻게 다르게 보이나요?", "부끄러웠던 그 순간의 나에게 가장 친한 친구처럼 건네주고 싶은 따뜻한 한마디는 무엇인가요?"]}, "fri-01": {"origin": "라틴어 'cor(심장, 마음)'에서 유래한 영어 'Courage'처럼, 두려움이 전혀 없는 무모함이 아니라 심장이 떨리고 망설여지는 순간에도 내 진심과 가치를 따라 한 걸음 내딛게 만드는 단단하고 따뜻한 내면의 감정이다.", "quote": "“용기는 두려움이 사라진 자리가 아니라, 두려움보다 더 소중한 무언가가 있음을 깨닫는 자리에서 태어난다.”", "author": "넬슨 만델라", "essay": "우리는 흔히 마음이 전혀 떨리지 않고 자신감이 넘치는 사람만 '용기'가 있다고 생각합니다. 그래서 새로운 일을 앞두고 가슴이 두근거리거나 솔직한 말을 꺼내기 전에 망설여지면 '나는 아직 용기가 부족해'라며 한 발 뒤로 물러서곤 합니다. 하지만 용기의 본래 어원이 '심장(마음)'을 뜻하듯, 용기는 떨리지 않는 강철 심장이 아니라 떨리는 마음을 안은 채로도 진심을 선택하는 따뜻하고 정직한 힘입니다.\n\n거창한 모험만이 용기가 아닙니다. 서운한 마음을 부드럽게 털어놓는 일, 무리한 부탁 앞에서 정중히 '어렵습니다'라고 말하는 일, 어제 실패했던 습관을 오늘 다시 한 번 시작해 보는 일 모두가 삶에서 가장 빛나는 용기의 감정입니다.\n\n두려움이 완전히 없어질 날을 기다리면 우리는 평생 출발선에만 서 있게 됩니다. 오늘 심장이 조금 두근거린다면 오히려 반가워해 주세요. 바로 그 떨림 옆에 당신의 용기가 이미 조용히 깨어나 함께 서 있다는 증거입니다.", "questions": ["두려움이나 망설임이 있었지만 끝내 마음을 다잡고 '용기'를 내어 보았던 가장 뿌듯한 기억은 무엇인가요?", "요즘 내 마음속에서 '조금만 용기를 내어 보면 좋겠다'고 속삭이고 있는 작은 시도는 무엇인가요?", "떨리는 순간에 내 마음을 가장 든든하게 붙들어 주는 나만의 용기 문장은 무엇인가요?"]}, "sat-01": {"origin": "'평평할 평(平)'과 '고요할 온(穩)'이 합쳐진 말로, 거센 흥분도 날 선 불안도 모두 잔잔히 가라앉아 마음의 수면이 바람 없는 호수처럼 고르고 편안하게 머무는 깊은 안식의 감정이다.", "quote": "“평온함은 폭풍이 전혀 없는 세상이 아니라, 삶의 소란 한가운데서도 내 안의 고요한 방을 지키는 감각이다.”", "author": "틱낫한", "essay": "우리는 자주 더 짜릿한 자극과 더 큰 성취를 쫓으며 하루를 채우지만, 한 주를 온전히 건너온 토요일의 끝자락에서 마음이 진짜로 그리워하는 감정은 화려한 흥분이 아니라 잔잔한 '평온함'입니다. 아무에게도 무언가를 증명할 필요가 없고, 시곗바늘에 쫓기지도 않으며, 지금 이 자리에 그저 숨 쉬고 있다는 사실만으로 충분하다고 느껴지는 맑고 고른 마음의 온도입니다.\n\n평온함은 아무 감정도 느끼지 않는 무감각이나 지루함이 아닙니다. 오히려 기쁨과 슬픔, 불안과 분노의 파도를 모두 겪어 낸 뒤에야 비로소 알게 되는 가장 깊고 성숙한 행복의 바탕색입니다. 따뜻한 햇살이 드는 창가, 갓 우려낸 차의 김이 오르는 1분, 사랑하는 이의 곁에서 나누는 말 없는 미소 속에 평온함은 조용히 내려앉습니다.\n\n오늘 하루를 마칠 때 거창한 일로 시간을 채우려 애쓰지 마세요. 숨을 천천히 길게 내쉬며 내 안의 물결이 잔잔히 가라앉는 그 맑은 평온함을 온몸으로 느껴 보는 토요일이 되기를 바랍니다.", "questions": ["최근 일주일 동안 마음이 가장 잔잔하고 '평온함'에 가까웠던 순간은 언제, 어디였나요?", "들뜬 기쁨과 잔잔한 평온함은 내 몸과 마음에서 어떻게 다르게 느껴지나요?", "이번 주말에 내 마음에 깊은 평온함을 선물해 주기 위해 잠시 내려놓고 싶은 분주함은 무엇인가요?"]}}}, "needs": {"key": "needs", "label": "욕구", "fullTitle": "욕구 단어 52주", "unit": "욕구", "itemLabel": "욕구 단어", "dataDir": "mind_data", "globalVars": ["NEEDS_VOCAB_DATA", "MIND_NEEDS_DATA"], "jsonFilename": "needs-vocab-364.json", "backupPrefix": "needs-vocab-backup-", "originPlaceholder": "욕구의 어원과 핵심 개념을 입력하세요.", "storageKeys": {"essays": "needs_vocab_52_essays_v1", "answers": "needs_vocab_52_answers_v1", "read": "needs_vocab_52_read_v1", "favorites": "needs_vocab_52_favorites_v1"}, "daysMeta": [{"key": "su : {"sun-01": {"origin": "'뜻 의(意)'와 '맛 미(味)'가 합쳐진 말로, 내가 보내는 시간과 노력이 단순한 반복에 그치지 않고 가치 있는 방향과 연결되어 있음을 느끼고 싶은 인간의 가장 깊은 보편적 욕구다.", "quote": "“왜 살아야 하는지 아는 사람은 거의 어떤 '어떻게'도 견뎌 낼 수 있다.”", "author": "빅터 프랭클", "essay": "바쁘게 하루를 채우고 할 일을 모두 끝냈는데도 문득 마음 한구석이 허전할 때가 있습니다. 그 공허함은 우리가 게으르거나 부족해서가 아니라, 내 안의 '의미'에 대한 욕구가 조용히 채워지기를 기다리고 있다는 신호입니다. 사람은 그저 버티고 생존하는 것만으로 만족하지 않고, 나의 오늘이 누군가에게 혹은 나의 삶 자체에 어떤 뜻을 지니는지 알고 싶어 합니다.\n\n비폭력대화에서는 욕구와 전략을 구분하는 일이 중요하다고 말합니다. 거창한 업적이나 남들의 박수는 수많은 전략 중 하나일 뿐, 우리가 진짜로 갈망하는 핵심 욕구는 '내가 하는 일이 가치 있다'는 살아 있는 감각입니다. 작은 일이라도 내 마음의 기준과 맞닿아 있을 때 평범한 일상에도 선명한 생기가 돋습니다.\n\n새로운 한 주를 여는 일요일, 해야 할 일의 목록을 쓰기 전에 스스로에게 딱 한 가지만 물어보세요. '이번 주에 내가 마음을 담아 정성을 기울이고 싶은 의미 있는 일은 무엇인가?' 그 질문 하나가 바쁜 하루에 단단한 방향을 세워 줍니다.", "questions": ["최근에 내가 했던 일 중 크기는 작더라도 '참 의미 있었다'고 느껴졌던 순간은 언제였나요?", "삶이 무의미하거나 허전하게 느껴질 때, 내 안의 어떤 가치와 잠시 멀어져 있었던 걸까요?", "이번 주 하루를 보람차게 만들기 위해 내가 직접 의미를 부여해 보고 싶은 일 한 가지는 무엇인가요?"]}, "mon-01": {"origin": "그리스어 'autos(스스로)'와 'nomos(법칙)'에서 유래한 말로, 외부의 강요나 눈치에 떠밀리지 않고 자신의 가치와 판단에 따라 삶의 방향과 방식을 스스로 선택하고 싶은 근원적 욕구다.", "quote": "“인간이 가장 생기 있게 살아 숨 쉬는 순간은 '해야 해서'가 아니라 '내가 선택해서' 움직일 때다.”", "author": "에드워드 데시", "essay": "똑같은 일이라도 남이 시켜서 억지로 할 때는 금세 지치고 반발심이 생기지만, 내가 스스로 고르고 결정했을 때는 기꺼이 힘을 내어 해내는 경험을 누구나 해 보았을 것입니다. 그 차이를 만드는 뿌리가 바로 '자율성'에 대한 욕구입니다. 자율성은 제멋대로 하겠다는 고집이 아니라, 내 삶의 운전대를 내가 쥐고 있다는 건강한 주체감입니다.\n\n월요일처럼 정해진 일정과 책임이 쏟아지는 날에는 자율성의 욕구가 쉽게 위협받곤 합니다. 이럴 때 마음속에 짜증이나 무기력이 올라온다면, 그 감정은 '나도 내 방식과 속도를 선택하고 싶다'는 소중한 욕구가 보내는 신호입니다. 전체 상황을 당장 바꿀 수 없더라도, 일의 순서나 휴식 시간, 마음을 대하는 태도처럼 내가 직접 고를 수 있는 작은 선택지를 찾아내는 순간 숨통이 트입니다.\n\n오늘 하루를 '떠밀려 가는 시간'으로 두지 말고, 아주 작은 것 하나라도 '이것은 내가 선택한다'고 선언해 보세요. 작은 자율성 하나가 하루 전체의 에너지를 바꿉니다.", "questions": ["요즘 일상에서 '떠밀려 하고 있다'는 답답함이 드는 영역은 어디인가요?", "바꿀 수 없는 일정 속에서도 내가 스스로 선택할 수 있는 작은 자율의 영역은 무엇인가요?", "오늘 하루 나만의 리듬과 선택을 존중해 주기 위해 결정하고 싶은 한 가지는 무엇인가요?"]}, "tue-01": {"origin": "서로의 마음과 삶이 벽 없이 이어져 이해받고 이해하며, 혼자가 아니라 함께 존재하고 있음을 느끼고 싶은 관계의 가장 핵심적인 욕구다.", "quote": "“연결은 인간이 이 땅에 존재하는 이유이며, 우리 삶에 목적과 온기를 부여하는 힘이다.”", "author": "브레네 브라운", "essay": "사람들 사이에 둘러싸여 하루 종일 대화를 나누었는데도 집에 돌아오면 유난히 외롭고 공허한 날이 있습니다. 반대로 짧은 안부 한마디, 눈빛 한 번만으로 마음이 꽉 차오르는 날도 있습니다. 우리가 진짜로 원하는 것은 단순한 접촉이나 말의 양이 아니라, 내 진심이 상대에게 닿고 상대의 진심이 나에게 닿는 깊은 '연결'이기 때문입니다.\n\n누군가에게 서운하거나 화가 날 때도 그 감정의 밑바닥을 가만히 들여다보면 대부분 '당신과 더 잘 이어지고 싶다', '내 마음을 알아주었으면 좋겠다'는 연결의 욕구가 자리 잡고 있습니다. 상대를 비난하거나 옳고 그름을 따지기 전에 내 안의 연결 욕구를 먼저 알아차리면, 대화가 싸움이 아니라 진심 어린 소통으로 방향을 틉니다.\n\n오늘 만나는 사람 중 한 사람에게만이라도 판단이나 조언을 잠시 내려놓고, '지금 이 사람의 마음은 어떨까?' 하며 온전히 귀 기울여 보세요. 진심 어린 경청 한 번이 가장 따뜻한 연결의 다리가 됩니다.", "questions": ["최근에 누군가와 마음이 진심으로 통하며 깊은 '연결'을 느꼈던 순간은 언제였나요?", "관계에서 서운함이나 거리감이 들 때, 그 아래에서 내가 정말 바라고 있던 연결의 모습은 무엇이었나요?", "오늘 소중한 사람 한 명에게 먼저 따뜻한 연결을 건네기 위해 해 보고 싶은 작은 표현은 무엇인가요?"]}, "wed-01": {"origin": "꾸미거나 숨기지 않고 내 안의 생각, 감정, 욕구와 겉으로 드러나는 말과 행동이 하나로 일치하기를 바라는 정직하고 투명한 존재의 욕구다.", "quote": "“진정성은 완벽한 사람이 되려는 노력이 아니라, 있는 그대로의 나를 매일 선택하는 용기다.”", "author": "브레네 브라운", "essay": "좋은 사람으로 보이고 싶어서, 혹은 분위기를 깨기 싫어서 속마음과 다른 웃음을 지어 보였던 날은 유독 몸보다 마음이 더 피곤합니다. 겉모습과 속마음 사이의 간격이 벌어질수록 우리는 알게 모르게 많은 에너지를 소모하기 때문입니다. 그때 마음속에서 올라오는 불편함과 찝찝함은 바로 '진정성'의 욕구가 나를 부르고 있다는 신호입니다.\n\n진정성은 거칠게 속내를 다 쏟아내는 무례함이 아닙니다. 먼저 나 자신에게 '지금 나는 괜찮지 않구나', '사실은 이것을 원하고 있구나'라고 정직하게 인정해 주는 자기 투명함에서 시작합니다. 내가 내 마음에 솔직해질 때 비로소 타인 앞에서도 과장하거나 움츠러들지 않고 담백하게 진심을 전할 수 있습니다.\n\n한 주의 한가운데에 선 수요일, 잠시 가면의 무게를 내려놓고 내 마음의 진짜 목소리를 들어 주세요. 있는 그대로의 나로 숨 쉴 때 내면은 가장 단단하고 맑아집니다.", "questions": ["최근에 남의 시선이나 분위기를 맞추느라 내 진짜 마음과 다르게 행동해 피곤했던 적이 있나요?", "지금 내 안에서 가장 솔직하게 인정해 주고 싶은 감정과 욕구는 무엇인가요?", "상대를 다치지 않게 하면서도 나의 진심을 담백하게 표현할 수 있는 문장을 적어 볼까요?"]}, "thu-01": {"origin": "신체적 위험뿐 아니라 비난, 예측 불가능성, 정서적 위협으로부터 보호받으며 경계를 풀고 온전히 안심하고 싶은 생존과 회복의 기초 욕구다.", "quote": "“마음이 안전하다고 느낄 때 비로소 사람은 방어를 내리고 배움과 사랑으로 나아갈 수 있다.”", "author": "스티븐 포지스", "essay": "별다른 큰일이 없는데도 어깨가 잔뜩 올라가 있고 사소한 말 한마디에 예민하게 반응하게 될 때가 있습니다. 이럴 때 우리는 스스로를 '왜 이렇게 예민하지?' 하고 탓하기 쉽지만, 사실 우리 몸과 마음은 지금 '안전'의 욕구가 충분히 채워지지 않았다고 알리고 있는 것입니다. 안전은 단지 사고가 없는 상태가 아니라, 공격받거나 평가받지 않을 것이라는 심리적·정서적 안심까지 포함합니다.\n\n안전의 욕구가 채워지지 않은 상태에서는 아무리 좋은 조언도, 새로운 도전도 부담과 위협으로 느껴집니다. 반대로 '여기서는 실수해도 괜찮아', '지금은 잠시 쉬어도 무너지지 않아'라는 작은 안전감이 확보되면 굳어 있던 몸이 풀리고 생각의 여유가 돌아옵니다.\n\n지치기 쉬운 목요일, 스스로를 더 채찍질하기보다 먼저 나만의 안전한 울타리를 점검해 보세요. 따뜻한 물 한 잔, 잠시의 침묵, 나를 판단하지 않는 공간처럼 작고 확실한 안전을 선물하는 시간이 다시 일어설 힘을 만듭니다.", "questions": ["요즘 내 몸과 마음이 가장 긴장하거나 '안전하지 않다'고 느끼는 상황은 무엇인가요?", "내가 경계를 풀고 가장 편안하게 숨 쉴 수 있는 공간이나 사람, 시간은 언제인가요?", "오늘 지친 나에게 심리적·신체적 안전감을 선물하기 위해 해 줄 수 있는 가장 구체적인 돌봄은 무엇인가요?"]}, "fri-01": {"origin": "바깥의 갈등과 소란은 물론 내 안의 다툼과 조급함마저 가라앉아, 모든 것이 제자리에 고르게 놓인 듯한 균형과 안정을 누리고 싶은 깊은 욕구다.", "quote": "“평화는 바깥 세상의 소음이 완전히 멈출 때가 아니라, 내 안의 싸움을 멈출 때 시작된다.”", "author": "틱낫한", "essay": "한 주 동안 크고 작은 일정과 관계의 마찰을 건너온 금요일이 되면, 마음은 어느새 '이기는 것'보다 '평화로운 것'을 더 간절히 바라게 됩니다. 우리가 흔히 겪는 피로의 상당 부분은 바깥의 사건 자체보다 '왜 저렇게 말했을까', '이렇게 했어야 했는데'라며 머릿속에서 계속되는 내면의 싸움에서 비롯됩니다.\n\n비폭력대화에서 평화는 갈등을 억지로 덮고 참아 내는 침묵이 아닙니다. 나와 상대의 욕구를 모두 소중히 여기며 대립을 넘어 조화로운 길을 모색하는 능동적인 마음의 태도입니다. 아직 풀리지 않은 일이 있더라도 오늘 내가 할 수 있는 몫과 내려놓아야 할 몫을 차분히 구분하는 순간, 마음에는 고요한 평화가 자리 잡습니다.\n\n이번 금요일에는 해결되지 않은 걱정을 주말까지 억지로 끌고 가지 말고 잠시 내려놓아 보세요. 한 주를 성실히 살아 낸 나 자신과 먼저 화해하는 것이 가장 가까운 평화의 시작입니다.", "questions": ["요즘 내 마음의 평화를 가장 자주 흔들어 놓는 내면의 갈등이나 걱정은 무엇인가요?", "꼭 이기거나 통제하려 애쓰는 대신, 평화를 선택하며 잠시 내려놓을 수 있는 일은 무엇일까요?", "오늘 하루를 마무리하며 내 마음에 고요와 균형을 되찾아 줄 작은 정리 습관은 무엇인가요?"]}, "sat-01": {"origin": "생산성이나 성과, 평가의 잣대에서 벗어나 그저 재미있고 즐겁다는 이유만으로 마음껏 웃고 움직이며 생동감을 누리고 싶은 순수한 삶의 욕구다.", "quote": "“놀이는 일에서 도망치는 게으름이 아니라, 어른의 마음을 다시 살아 숨 쉬게 만드는 가장 지혜로운 회복이다.”", "author": "스튜어트 브라운", "essay": "어른이 되면서 우리는 어느새 모든 시간 앞에 '이게 무슨 도움이 되지?'라는 효율의 잣대를 들이대기 시작합니다. 그래서 목적 없이 웃고, 쓸모없어 보이는 취미에 푹 빠지고, 가벼운 장난을 주고받는 '놀이'의 시간을 사치나 낭비처럼 여기곤 합니다. 하지만 놀이를 잃어버린 삶은 아무리 성실해도 금세 잿빛으로 메말라 버립니다.\n\n놀이는 아이들만의 전유물이 아닙니다. 결과에 대한 부담 없이 온전히 즐기는 놀이의 욕구가 채워질 때, 굳어 있던 뇌의 창의성이 깨어나고 관계에는 유머와 유연함이 돌아옵니다. 삶이 너무 진지하고 무거워졌을 때 우리에게 정말 필요한 처방은 더 거창한 계획이 아니라 가볍게 한바탕 웃어 넘길 수 있는 여백일지도 모릅니다.\n\n주말을 맞이한 토요일, 성과나 쓸모를 따지지 말고 오직 '그냥 좋아서' 하는 시간 한 가지를 나에게 허락해 주세요. 가볍게 놀고 감사히 누리는 마음이 다음 한 주를 살아갈 가장 싱그러운 활력이 됩니다.", "questions": ["최근에 성과나 유용성을 전혀 따지지 않고 오직 재미있어서 푹 빠져 보았던 '놀이'의 순간은 언제였나요?", "어린 시절의 내가 시간 가는 줄 모르고 즐겼던 놀이 중, 지금의 나에게도 다시 초대해 보고 싶은 감각은 무엇인가요 , "Observation vs Evaluation"], ["사실 확인", "Fact-Checking"], ["판단 유보", "Suspending Judgment"], ["맥락 살피기", "Seeing the Context"], ["가설로 보기", "Thought as Hypothesis"], ["해석 알아차림", "Noticing Interpretation"], ["메타인지", "Metacognition"], ["열린 시선", "Open Perspective"], ["균형 잡힌 시각", "Balanced View"], ["중립적 서술", "Neutral Description"], ["배후 욕구 보기", "Looking Behind to Needs"], ["자기 자비적 시선", "Self-Compassionate Lens"], ["행동과 존재 분리", "Behavior vs Identity"], ["비판 없는 알아차림", "Non-Judgmental Awareness"], ["생각과 사실 분리", "Cognitive Defusion"], ["다각도 검토", "Multi-Angle Inquiry"], ["반증 찾아보기", "Checking Counter-Evidence"], ["친구의 시선 빌리기", "Double-Standard Check"], ["회색 지대 인정", "Embracing Nuance"], ["양가성 수용", "Holding Both-And"], ["불확실성 견디기", "Tolerating Uncertainty"], ["시간적 거리두기", "Temporal Distancing"], ["공간적 한 발 물러남", "Stepping Back"], ["호기심으로 전환", "Shifting to Curiosity"], ["질문으로 바꾸기", "From Verdict to Question"], ["의도 대신 영향 보기", "Intent vs Impact"], ["상대의 사정 헤아림", "Charitable Interpretation"], ["나의 한계 수용", "Humane Limitation"], ["충분함의 기준", "Good-Enough Standard"], ["성장 과정으로 보기", "Work-in-Progress Lens"], ["실수의 데이터화", "Mistake as Feedback"], ["감정 라벨링", "Naming the Feeling"], ["자동적 사고 포착", "Catching Automatic Thoughts"], ["핵심 신념 탐색", "Exploring Core Beliefs"], ["내면 비평가와 거리두기", "Distancing Inner Critic"], ["현실적 낙관", "Realistic Optimism"], ["통제 영역 구분", "Circle of Control"], ["우선순위 분별", "Wise Discernment"], ["가치 기반 선택", "Value-Aligned Choice"], ["경계의 명료화", "Clear Boundary Discernment"], ["책임의 공정한 분배", "Fair Responsibility Pie"], ["겸손한 모름 인정", "Intellectual Humility"], ["생각의 유연성", "Cognitive Flexibility"], ["재해석의 힘", "Healthy Reframing"], ["감사와 균형 잡기", "Appreciative Balance"], ["현재 순간으로 귀환", "Returning to the Present"], ["초심자의 눈", "Beginner's Mind"], ["있는 그대로 보기", "Seeing Things As They Are"], ["단정 대신 가능성", "Possibility Over Verdict"], ["비난 대신 이해", "Understanding Over Blame"], ["명료한 분별력", "Clear Discernment"], ["자유로운 마음", "Unjudging Freedom"]]}, "starters": {"sun-01": {"origin": "한 번의 실수나 익숙하지 않은 과제의 어려움을 '나는 원래 능력이 없는 사람'이라는 고정된 인격 낙인으로 일반화해 버리는 대표적인 자기비난 판단이다.", "quote": "“'나는 무능하다'는 말은 사실이 아니라, 지금 내 안의 성장과 유능감에 대한 욕구가 크게 흔들리고 있다는 아픈 외침이다.”", "author": "캐롤 드웩", "essay": "처음 맡은 업무에서 실수를 저질렀거나, 기대만큼 성과를 내지 못한 날 저녁이면 머릿속에서 아주 익숙하고 차가운 판사가 망치를 두드립니다. '봐, 너는 역시 무능해.' 그 짧은 판단 한 줄이 내려지는 순간, 구체적인 실수를 고쳐 볼 힘마저 순식간에 빠져나가 버립니다.\n\n하지만 가만히 사실과 판단을 나누어 보면, 오늘 일어난 객관적 사실은 '이 과제에서 아직 익숙하지 않은 부분이 있어 시간이 더 걸렸다' 혹은 '한 가지 확인을 놓쳤다'일 뿐입니다. 그것을 '무능함'이라는 존재 전체의 꼬리표로 묶어 버리는 순간, 우리는 배울 수 있는 기회를 스스로 닫아 버리게 됩니다.\n\n일요일의 첫 판단 단어 앞에서 내면의 판사에게 잠시 멈춤을 요청해 보세요. '나는 무능하다'라는 단정 뒤에 숨어 있는 진짜 감정은 아마도 두려움이나 실망감일 것이고, 그 아래에는 '잘 해내고 싶고 도움이 되고 싶다'는 귀한 유능감과 기여의 욕구가 살아 숨 쉬고 있습니다.", "questions": ["최근에 작은 실수나 서투름 하나를 '나는 무능해'라는 존재 전체의 판단으로 확대해 버렸던 순간은 언제였나요?", "그 상황에서 판단을 모두 빼고 카메라로 찍듯 '객관적 사실'만 한 문장으로 다시 적어 본다면 어떻게 될까요?", "그 판단 아래에서 내가 진짜로 간절히 원하고 있던 소중한 욕구(유능감, 성장, 인정 등)는 무엇이었나요?"]}, "mon-01": {"origin": "작은 흠이나 실수도 결코 허용하지 않고, 매 순간 100% 완벽해야만 비로소 가치 있고 안전하다고 믿는 경직된 당위적 판단이다.", "quote": "“완벽주의는 자기 계발이 아니라, 비난과 수치심을 피하기 위해 짊어지고 다니는 20톤짜리 방패다.”", "author": "브레네 브라운", "essay": "월요일 아침 일정을 펼치며 '이번 주에는 단 하나의 빈틈도 없이 완벽하게 해내야 해'라고 다짐할 때, 겉으로는 아주 성실하고 멋져 보입니다. 하지만 '완벽해야 함'이라는 판단이 운전대를 잡는 순간, 일은 즐거움이 아니라 실수하면 큰일 나는 살얼음판으로 변해 버립니다.\n\n건강한 최선과 완벽주의는 전혀 다릅니다. 최선은 '내가 할 수 있는 정성을 다하되, 부족한 점은 배우며 고쳐 가면 돼'라고 말하는 반면, 완벽해야 한다는 판단은 '조금이라도 부족하면 다 실패야'라며 시작조차 미루게 만들거나 끝낸 뒤에도 만족을 빼앗아 갑니다.\n\n오늘 내 머릿속에서 '완벽해야 해'라는 엄격한 규칙이 울릴 때는, 그 뒤에 숨은 '안전하고 싶고 신뢰받고 싶다'는 따뜻한 욕구를 먼저 알아주세요. 80점짜리 성실한 완료가 시작조차 못 한 100점짜리 완벽함보다 삶을 훨씬 풍요롭게 만듭니다.", "questions": ["요즘 '완벽해야 함'이라는 판단 때문에 오히려 시작을 미루거나 끝내고도 마음이 불편했던 일은 무엇인가요?", "완벽하지 않으면 어떤 일이 벌어질 것 같아 두려웠던 걸까요?", "오늘 내가 맡은 일에서 '완벽함' 대신 '충분히 정성스러운 80점'의 기준으로 바꾸어 본다면 마음이 어떻게 달라질까요?"]}, "tue-01": {"origin": "상대방의 구체적인 말이나 행동을 그대로 서술하는 대신, '저 사람은 기본이 안 되고 무례한 사람'이라고 인격 전체에 꼬리표를 붙여 버리는 타인 비난 판단이다.", "quote": "“상대를 '무례한 사람'이라고 규정하는 순간 대화의 문은 닫히지만, 내가 불편했던 구체적 행동과 욕구를 말하면 대화는 다시 열린다.”", "author": "마셜 로젠버그", "essay": "대화 중에 상대가 내 말을 중간에 끊었거나, 인사 없이 퉁명스럽게 지시만 던지고 돌아섰을 때 우리 머릿속에서는 즉각 '정말 무례하네!'라는 판단이 번개처럼 스칩니다. 그 판단은 아주 빠르고 시원하게 느껴지지만, 동시에 내 안의 분노를 키우고 상대를 대화 불가능한 악당으로 고정시켜 버립니다.\n\n비폭력대화에서는 '무례함'이라는 판단을 내리기 전에, 먼저 카메라에 찍힐 사실로 되돌려 보라고 권합니다. '상대가 내 이야기가 끝나기 전에 다른 화제로 넘어갔다'는 관찰과, '나는 내 이야기가 끝까지 경청받고 존중받기를 원한다'는 나의 욕구로 나누어 보는 것입니다.\n\n상대의 무례한 행동을 무조건 참아야 한다는 뜻이 아닙니다. 인격을 비난하는 꼬리표 대신 사실과 나의 경계를 또박또박 전할 때, 상대도 방어벽을 덜 세우고 내 목소리에 귀를 기울일 가능성이 훨씬 높아집니다.", "questions": ["최근에 누군가를 보며 속으로 '정말 무례하다'고 판단했던 구체적인 행동 장면은 무엇이었나요?", "그 순간 '무례함'이라는 꼬리표 아래에서 내가 상대에게 진심으로 바랐던 욕구(존중, 경청, 배려 등)는 무엇이었나요?", "상대를 비난하는 말 대신, 구체적인 사실과 내가 원하는 바를 차분히 전한다면 어떻게 말해 볼 수 있을까요?"]}, "wed-01": {"origin": "상대방에게 직접 묻거나 확인하지 않은 채, 표정·침묵·짧은 답장 같은 단편적 단서만으로 상대의 속마음과 의도를 부정적으로 단정 짓는 인지 왜곡 판단이다.", "quote": "“우리가 관계에서 겪는 고통의 절반 이상은 상대가 실제로 한 말이 아니라, 내가 지레짐작으로 써 내려간 독심술 대본에서 온다.”", "author": "아론 벡", "essay": "메시지를 보냈는데 한참 동안 읽음 표시만 뜨고 답장이 없을 때, 혹은 회의 중 동료가 팔짱을 끼고 무표정하게 앉아 있을 때 우리 머릿속에서는 순식간에 한 편의 드라마가 완성됩니다. '분명 내 말이 기분 나빴을 거야', '나를 싫어해서 무시하는 거지 뭐.' 바로 확인 없는 추측인 '독심술' 판단입니다.\n\n하지만 실제로 나중에 물어보면 상대는 그저 급한 전화가 와서 답장을 못 했거나, 어젯밤 잠을 설쳐서 피곤했을 뿐 나에 대해 아무런 악감정도 없었던 경우가 셀 수 없이 많습니다. 독심술의 가장 큰 함정은 내 머릿속 추측을 '확실한 사실'로 믿고 먼저 차갑게 거리를 두어, 없던 갈등을 현실로 만들어 버린다는 점입니다.\n\n수요일에 누군가의 속마음을 넘겨짚는 생각이 올라오거든, 그 문장 앞에 '혹시 내 추측일 뿐 아닐까?'라는 작은 물음표 하나를 꼭 붙여 보세요. 추측을 질문으로 바꾸는 순간 관계의 불필요한 오해가 눈 녹듯 줄어듭니다.", "questions": ["최근에 직접 확인하지 않고 상대의 표정이나 침묵만으로 '분명 이렇게 생각할 거야' 하고 '독심술'을 썼던 적이 있나요?", "그 상황에서 내가 떠올린 부정적 추측 외에, 전혀 다른 평범하고 무해한 이유 두 가지를 상상해 본다면 무엇일까요?", "혼자 속을 끓이며 추측하는 대신 상대에게 가볍고 솔직하게 확인해 볼 수 있는 한 문장은 무엇인가요?"]}, "thu-01": {"origin": "현재의 작은 실수나 불확실한 신호를 출발점으로 삼아, 중간 단계를 모두 건너뛰고 가장 끔찍한 최악의 결말로 곧장 비약해 버리는 공포 기반 판단이다.", "quote": "“파국화는 아직 일어나지 않은 내일의 폭풍을 오늘의 방 안으로 미리 끌어와 미리 젖어 떨게 만든다.”", "author": "앨버트 엘리스", "essay": "보고서에서 오타 하나를 발견했을 때 '이것 때문에 신뢰를 완전히 잃고 프로젝트 전체가 무너질 거야'라고 생각하거나, 몸이 조금 피곤할 때 '혹시 큰 병에 걸린 건 아닐까?' 하며 순식간에 최악의 장면까지 달려가는 사고 습관이 바로 '파국화'입니다.\n\n파국화가 작동하는 이유는 우리 뇌가 위험을 미리 대비해 나를 지키려고 비상경보를 최대로 울리기 때문입니다. 하지만 최악의 시나리오만 확대경으로 들여다보고 있으면, 정작 눈앞에서 충분히 수습할 수 있는 작은 현실적 대책마저 보이지 않게 됩니다.\n\n마음이 최악의 결말로 급발진할 때는 세 가지 질문으로 브레이크를 밟아 보세요. '가장 최악의 경우는 무엇인가? 가장 좋은 경우는 무엇인가? 그리고 현실적으로 가장 일어날 법한 평범한 결과는 무엇인가?' 현실의 지면으로 발을 내려놓는 순간 공포의 확대경은 제 크기로 돌아옵니다.", "questions": ["최근에 작은 문제 하나에서 시작해 '이제 다 망했어'라는 최악의 결말로 달려갔던 '파국화'의 경험이 있나요?", "과거에 큰일이 날 것 같아 밤잠을 설쳤던 걱정 중, 실제로 최악의 파국으로 이어졌던 일은 몇 번이나 있었나요?", "지금 나를 불안하게 만드는 일에서 '최악의 시나리오' 대신 '가장 현실적으로 일어날 법한 결과'를 적어 본다면 무엇일까요?"]}, "fri-01": {"origin": "각자 다른 출발선과 고유한 삶의 속도를 무시한 채, 타인의 성취와 타임라인을 절대 기준으로 삼아 내가 늦고 모자란 위치에 있다고 평가하는 비교 판단이다.", "quote": "“비교는 기쁨의 도둑이다. 남의 시계에 내 하루를 맞추는 순간, 지금 내가 걸어온 귀한 길마저 초라해진다.”", "author": "시어도어 루스벨트", "essay": "비슷한 나이의 지인이 더 빠르게 자리를 잡거나 멋진 소식을 전해 올 때, 문득 가슴이 서늘해지며 '나는 지금 너무 뒤처져 있어'라는 판단이 고개를 듭니다. 금요일의 비교와 서열 판단은 우리가 열심히 살아온 오늘의 수고마저 단숨에 초라한 제자리걸음으로 바꾸어 버립니다.\n\n하지만 인생은 모두가 같은 트랙을 동시에 출발해 한 줄로 결승선을 통과하는 100미터 달리기가 아닙니다. 어떤 꽃은 이른 봄에 피고 어떤 나무는 늦가을에야 깊은 열매를 맺듯, 각자의 계절과 속도가 모두 다릅니다. 게다가 우리는 늘 남의 편집된 최고의 순간과 나의 가장 지친 일상을 비교하는 불공정한 저울을 쓰곤 합니다.\n\n오늘 '뒤처졌다'는 판단이 올라온다면 저울의 비교 대상을 타인에서 '1년 전의 나'로 바꾸어 올려 보세요. 어제의 나보다 분명히 배우고 단단해진 나의 고유한 걸음이 다시 선명하게 보일 것입니다.", "questions": ["최근에 누구의 속도나 기준과 나를 견주어 보며 '내가 뒤처지고 있다'고 판단했던 순간은 언제였나요?", "내가 부러워하거나 비교했던 그 기준은 정말 내가 진심으로 원하는 삶인가요, 아니면 사회가 정해 준 평균표인가요?", "타인이 아니라 '1년 전의 나'와 비교해 보았을 때, 분명히 자라나고 나아진 나만의 성장은 무엇인가요?"]}, "sat-01": {"origin": "눈앞에서 실제로 일어난 객관적 사실(관찰)과 내 머릿속의 해석·꼬리표(평가)를 맑게 분리해 바라봄으로써, 자동적인 판단의 굴레에서 벗어나는 가장 핵심적인 전환의 기술이다.", "quote": "“평가하지 않고 관찰하는 능력은 인간 지성의 가장 높은 형태다.”", "author": "지두 크리슈나무르티", "essay": "일요일부터 금요일까지 우리는 나를 베고 남을 찌르며 미래를 겁내는 수많은 자동적 판단들을 살펴보았습니다. 그리고 토요일의 첫 문턱에서 만나는 가장 중요한 열쇠가 바로 '관찰과 평가 구분'입니다. 판단을 아예 없애는 것은 불가능하지만, 내 머릿속에 떠오른 말이 '사실(관찰)'인지 '내 해석(평가)'인지 구분해 내는 순간 우리는 판단의 노예에서 주인으로 돌아옵니다.\n\n예를 들어 '저 사람은 늘 무책임해'는 평가이지만, '이번 주 회의 자료가 약속한 시간보다 하루 늦게 공유되었다'는 관찰입니다. '나는 게으르고 한심해'는 평가이지만, '이번 주에 계획했던 운동 세 번 중 한 번만 했다'는 관찰입니다. 관찰의 언어로 바꾸는 것만으로 수치심과 분노의 열기가 가라앉고, 비로소 해결과 대화의 공간이 열립니다.\n\n오늘 하루 내 머릿속을 스치는 날카로운 판단 문장 하나를 붙잡아, 아무 형용사도 붙이지 않은 순수한 카메라의 '관찰 문장'으로 한 번만 번역해 보세요. 마음이 놀랄 만큼 맑고 자유로워지는 경험을 하게 될 것입니다.", "questions": ["이번 주 내 머릿속에 자주 떠올랐던 판단(평가) 문장 하나를 골라, 감정을 뺀 순수한 '관찰 문장'으로 바꾸어 볼까요?", "평가 대신 사실 그대로 관찰해 보았을 때, 내 안의 분노나 자책의 크기는 어떻게 달라졌나요?", "앞으로 마음이 크게 흔들리는 순간에 '잠깐, 이건 관찰인가 평가인가?' 하고 멈춰 물어보고 싶은 상황은 언제인가요?"]}}}};

    // 현재 활성 카테고리 접근자
    function catCfg(ck = currentCatKey) { return CATEGORIES[ck] || CATEGORIES.word; }
    function catState(ck = currentCatKey) { return stateByCat[ck] || stateByCat.word; }

    function isMobileViewport() { return window.innerWidth <= MOBILE_BREAKPOINT; }
    function pad2(n) { return String(n).padStart(2, '0'); }
    function getWordKey(dayKey, idx) { return `${dayKey}-${pad2(idx + 1)}`; }
    function getDayMeta(dayKey, ck = currentCatKey) {
      const dm = catCfg(ck).daysMeta;
      return dm.find(d => d.key === dayKey) || dm[0];
    }
    function getTodayDayKey() { return DAY_KEYS[new Date().getDay()]; }
    function getLocalDateStr() {
      const d = new Date();
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function formatDateFromTimestamp(ts) {
      if (!ts || typeof ts !== 'number' || !Number.isFinite(ts) || ts <= 0) return '';
      const d = new Date(ts);
      if (Number.isNaN(d.getTime())) return '';
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
    }

    function formatNow24() {
      const d = new Date();
      return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())} ${pad2(d.getHours())}:${pad2(d.getMinutes())}`;
    }

    function escapeHtml(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    function showToast(msg) {
      toastEl.textContent = msg;
      toastEl.classList.add('show');
      clearTimeout(showToast._timer);
      showToast._timer = setTimeout(() => toastEl.classList.remove('show'), 2500);
    }

    function hasContent(entry) {
      return !!(entry && (entry.origin || entry.essay || entry.quote));
    }

    function getEntry(key, ck = currentCatKey) {
      const st = catState(ck);
      return st.storedEntries[key] || st.defaultEntries[key] || null;
    }

    // 기본 샘플 + ./{dataDir}/sun.js ~ sat.js 에서 주입된 전역 객체 자동 병합
    function loadDefaultDataForCategory(ck) {
      const cfg = catCfg(ck);
      const st = catState(ck);

      const starters = cfg.starters || {};
      Object.keys(starters).forEach(k => {
        const val = starters[k];
        if (val && typeof val === 'object') {
          st.defaultEntries[k] = {
            origin: String(val.origin || '').trim(),
            quote: String(val.quote || '').trim(),
            author: String(val.author || '').trim(),
            essay: String(val.essay || '').trim(),
            questions: Array.isArray(val.questions) ? val.questions.map(q => String(q).trim()).filter(Boolean) : []
          };
        }
      });

      (cfg.globalVars || []).forEach(varName => {
        const source = window[varName];
        if (!source || typeof source !== 'object') return;
        Object.keys(source).forEach(k => {
          const val = source[k];
          if (/^(sun|mon|tue|wed|thu|fri|sat)-\d{2}$/.test(k) && val && typeof val === 'object') {
            const entryObj = {
              origin: String(val.origin || '').trim(),
              quote: String(val.quote || '').trim(),
              author: String(val.author || '').trim(),
              essay: String(val.essay || '').trim(),
              questions: Array.isArray(val.questions) ? val.questions.map(q => String(q).trim()).filter(Boolean) : []
            };
            if (hasContent(entryObj)) {
              st.defaultEntries[k] = entryObj;
            }
          }
        });
      });
    }

    function getAnswerItems(key, minCount = 1, ck = currentCatKey) {
      const ans = catState(ck).storedAnswers[key];
      let arr = [];
      if (ans && Array.isArray(ans.items)) {
        arr = ans.items.map(v => String(v || ''));
      } else if (ans && typeof ans.text === 'string' && ans.text.length > 0) {
        arr = [ans.text];
      } else if (typeof ans === 'string' && ans.length > 0) {
        arr = [ans];
      }
      while (arr.length < minCount) arr.push('');
      return arr;
    }

    function getAnswerUpdatedAt(key, ck = currentCatKey) {
      const ans = catState(ck).storedAnswers[key];
      return (ans && typeof ans === 'object' && ans.updatedAt) ? String(ans.updatedAt) : '';
    }

    function hasAnswer(key, ck = currentCatKey) {
      const ans = catState(ck).storedAnswers[key];
      if (!ans) return false;
      if (Array.isArray(ans.items)) {
        return ans.items.some(v => String(v || '').trim().length > 0);
      }
      if (typeof ans === 'string') return ans.trim().length > 0;
      return !!(ans.text && String(ans.text).trim().length > 0);
    }

    function isWordRead(key, ck = currentCatKey) {
      const rec = catState(ck).storedRead[key];
      return !!(rec && (rec === true || rec.read === true));
    }

    function getWordReadAt(key, ck = currentCatKey) {
      const rec = catState(ck).storedRead[key];
      if (!rec) return 0;
      if (typeof rec === 'object' && typeof rec.readAt === 'number') return rec.readAt;
      return 0;
    }

    function getWordReadDate(key, ck = currentCatKey) {
      const rec = catState(ck).storedRead[key];
      if (!rec || typeof rec !== 'object') return '';
      if (typeof rec.readDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(rec.readDate.trim())) {
        return rec.readDate.trim();
      }
      if (typeof rec.readAt === 'number' && rec.readAt > 0) {
        return formatDateFromTimestamp(rec.readAt);
      }
      return '';
    }

    function isWordFav(key, ck = currentCatKey) {
      const rec = catState(ck).storedFavorites[key];
      return !!(rec && (rec === true || rec.fav === true));
    }

    function getWordFavAt(key, ck = currentCatKey) {
      const rec = catState(ck).storedFavorites[key];
      if (!rec) return 0;
      if (typeof rec === 'object' && typeof rec.favAt === 'number') return rec.favAt;
      return 0;
    }

    function getHeartSvg(filled, size = 19) {
      return `
        <svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="${filled ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
      `;
    }

    function getReadIndexOnDate(dayKey, dateStr, ck = currentCatKey) {
      const list = catCfg(ck).vocabList[dayKey] || [];
      if (!list.length || !dateStr) return -1;
      let matchedIdx = -1;
      let latestReadAt = -1;
      list.forEach((_, idx) => {
        const key = getWordKey(dayKey, idx);
        if (isWordRead(key, ck) && getWordReadDate(key, ck) === dateStr) {
          const ts = getWordReadAt(key, ck);
          if (ts > latestReadAt || (ts === latestReadAt && idx > matchedIdx)) {
            latestReadAt = ts;
            matchedIdx = idx;
          }
        }
      });
      return matchedIdx;
    }

    function getNextWordIndexForDay(dayKey, ck = currentCatKey) {
      const list = catCfg(ck).vocabList[dayKey] || [];
      if (!list.length) return 0;
      let lastReadIdx = -1;
      let latestReadAt = -1;
      list.forEach((_, idx) => {
        const key = getWordKey(dayKey, idx);
        if (isWordRead(key, ck)) {
          const ts = getWordReadAt(key, ck);
          if (ts > latestReadAt || (ts === latestReadAt && idx > lastReadIdx)) {
            latestReadAt = ts;
            lastReadIdx = idx;
          }
        }
      });
      if (lastReadIdx === -1) return 0;
      for (let i = lastReadIdx + 1; i < list.length; i++) {
        if (!isWordRead(getWordKey(dayKey, i), ck)) return i;
      }
      for (let i = 0; i < lastReadIdx; i++) {
        if (!isWordRead(getWordKey(dayKey, i), ck)) return i;
      }
      return 0;
    }

    function getTargetWordIndexForDay(dayKey, ck = currentCatKey) {
      if (dayKey === getTodayDayKey()) {
        const readTodayIdx = getReadIndexOnDate(dayKey, getLocalDateStr(), ck);
        if (readTodayIdx !== -1) return readTodayIdx;
      }
      return getNextWordIndexForDay(dayKey, ck);
    }
