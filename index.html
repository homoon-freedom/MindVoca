    // localStorage 입출력 (카테고리별 기존 키 100% 호환)
    function loadCategoryStorage(ck) {
      const keys = catCfg(ck).storageKeys;
      const st = catState(ck);
      const readJson = (storageKey) => {
        try {
          const raw = localStorage.getItem(storageKey);
          if (raw) {
            const parsed = JSON.parse(raw);
            if (parsed && typeof parsed === 'object') return parsed;
          }
        } catch (e) { console.error(storageKey, e); }
        return {};
      };
      st.storedEntries = readJson(keys.essays);
      st.storedAnswers = readJson(keys.answers);
      st.storedRead = readJson(keys.read);
      st.storedFavorites = readJson(keys.favorites);
    }

    function saveCategoryStorage(ck, part) {
      const keys = catCfg(ck).storageKeys;
      const st = catState(ck);
      const map = {
        essays: [keys.essays, st.storedEntries],
        answers: [keys.answers, st.storedAnswers],
        read: [keys.read, st.storedRead],
        favorites: [keys.favorites, st.storedFavorites]
      };
      const targets = part ? [map[part]] : Object.values(map);
      targets.forEach(([k, val]) => {
        try {
          localStorage.setItem(k, JSON.stringify(val));
        } catch (e) {
          alert('브라우저 저장 공간(localStorage) 저장에 실패했습니다.');
        }
      });
    }

    // JSON 파싱 및 병합 (단일 카테고리 또는 4개 탭 통합 백업 모두 지원)
    function mergeJsonPayloadForCategory(payload, ck) {
      const cfg = catCfg(ck);
      const st = catState(ck);
      let added = 0;
      let answersAdded = 0;
      let readAdded = 0;
      let favAdded = 0;

      if (payload && typeof payload === 'object' && payload._userAnswers && typeof payload._userAnswers === 'object') {
        Object.keys(payload._userAnswers).forEach(k => {
          const a = payload._userAnswers[k];
          if (a && typeof a === 'object' && Array.isArray(a.items) && a.items.some(v => String(v || '').trim())) {
            st.storedAnswers[k] = { items: a.items.map(v => String(v || '')), updatedAt: String(a.updatedAt || '') };
            answersAdded++;
          } else if (Array.isArray(a) && a.some(v => String(v || '').trim())) {
            st.storedAnswers[k] = { items: a.map(v => String(v || '')), updatedAt: '' };
            answersAdded++;
          } else if (a && typeof a === 'object' && String(a.text || '').trim()) {
            st.storedAnswers[k] = { items: [String(a.text)], updatedAt: String(a.updatedAt || '') };
            answersAdded++;
          } else if (typeof a === 'string' && a.trim()) {
            st.storedAnswers[k] = { items: [a], updatedAt: '' };
            answersAdded++;
          }
        });
      }

      if (payload && typeof payload === 'object' && payload._readRecords && typeof payload._readRecords === 'object') {
        Object.keys(payload._readRecords).forEach(k => {
          const r = payload._readRecords[k];
          if (r === true) {
            st.storedRead[k] = { read: true, readAt: 0, readDate: '' };
            readAdded++;
          } else if (r && typeof r === 'object' && r.read) {
            const ts = Number(r.readAt) || 0;
            const rd = (typeof r.readDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(r.readDate.trim()))
              ? r.readDate.trim()
              : formatDateFromTimestamp(ts);
            st.storedRead[k] = { read: true, readAt: ts, readDate: rd };
            readAdded++;
          }
        });
      }

      if (payload && typeof payload === 'object' && payload._favoriteRecords && typeof payload._favoriteRecords === 'object') {
        Object.keys(payload._favoriteRecords).forEach(k => {
          const fv = payload._favoriteRecords[k];
          if (fv === true) {
            st.storedFavorites[k] = { fav: true, favAt: 0 };
            favAdded++;
          } else if (fv && typeof fv === 'object' && fv.fav) {
            st.storedFavorites[k] = { fav: true, favAt: Number(fv.favAt) || 0 };
            favAdded++;
          }
        });
      }

      const source = (payload && typeof payload === 'object')
        ? (payload.entries || payload.data || payload)
        : null;

      if (!source || typeof source !== 'object') return { added, answersAdded, readAdded, favAdded };

      Object.keys(source).forEach(k => {
        const val = source[k];
        if (/^(sun|mon|tue|wed|thu|fri|sat)-\d{2}$/.test(k) && val && typeof val === 'object') {
          const entryObj = {
            origin: String(val.origin || '').trim(),
            quote: String(val.quote || '').trim(),
            author: String(val.author || '').trim(),
            essay: String(val.essay || '').trim(),
            questions: Array.isArray(val.questions) ? val.questions.map(q => String(q).trim()).filter(Boolean) : []
          };
          if (hasContent(entryObj)) {
            st.storedEntries[k] = entryObj;
            added++;
          }
          if (Array.isArray(val.userAnswers) && val.userAnswers.some(v => String(v || '').trim())) {
            st.storedAnswers[k] = {
              items: val.userAnswers.map(v => String(v || '')),
              updatedAt: String(val.userAnswerUpdatedAt || '')
            };
            answersAdded++;
          } else if (typeof val.userAnswer === 'string' && val.userAnswer.trim()) {
            st.storedAnswers[k] = {
              items: [val.userAnswer],
              updatedAt: String(val.userAnswerUpdatedAt || '')
            };
            answersAdded++;
          }
          if (val.isRead === true) {
            const ts = Number(val.readAt) || 0;
            const rd = (typeof val.readDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(val.readDate.trim()))
              ? val.readDate.trim()
              : formatDateFromTimestamp(ts);
            st.storedRead[k] = { read: true, readAt: ts, readDate: rd };
            readAdded++;
          }
          if (val.isFavorite === true) {
            st.storedFavorites[k] = { fav: true, favAt: Number(val.favAt) || 0 };
            favAdded++;
          }
        } else if (cfg.vocabList[k] && Array.isArray(val)) {
          val.forEach((item, idx) => {
            const key = getWordKey(k, idx);
            if (Array.isArray(item)) {
              const entryObj = {
                origin: String(item[2] || '').trim(),
                quote: String(item[3] || '').trim(),
                author: String(item[4] || '').trim(),
                essay: String(item[5] || '').trim(),
                questions: Array.isArray(item[6]) ? item[6] : []
              };
              if (hasContent(entryObj)) {
                st.storedEntries[key] = entryObj;
                added++;
              }
            } else if (item && typeof item === 'object') {
              const entryObj = {
                origin: String(item.origin || '').trim(),
                quote: String(item.quote || '').trim(),
                author: String(item.author || '').trim(),
                essay: String(item.essay || '').trim(),
                questions: Array.isArray(item.questions) ? item.questions : []
              };
              if (hasContent(entryObj)) {
                st.storedEntries[key] = entryObj;
                added++;
              }
              if (Array.isArray(item.userAnswers) && item.userAnswers.some(v => String(v || '').trim())) {
                st.storedAnswers[key] = {
                  items: item.userAnswers.map(v => String(v || '')),
                  updatedAt: String(item.userAnswerUpdatedAt || '')
                };
                answersAdded++;
              } else if (typeof item.userAnswer === 'string' && item.userAnswer.trim()) {
                st.storedAnswers[key] = {
                  items: [item.userAnswer],
                  updatedAt: String(item.userAnswerUpdatedAt || '')
                };
                answersAdded++;
              }
              if (item.isRead === true) {
                const ts = Number(item.readAt) || 0;
                const rd = (typeof item.readDate === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(item.readDate.trim()))
                  ? item.readDate.trim()
                  : formatDateFromTimestamp(ts);
                st.storedRead[key] = { read: true, readAt: ts, readDate: rd };
                readAdded++;
              }
              if (item.isFavorite === true) {
                st.storedFavorites[key] = { fav: true, favAt: Number(item.favAt) || 0 };
                favAdded++;
              }
            }
          });
        }
      });

      return { added, answersAdded, readAdded, favAdded };
    }

      cfg.daysMeta.forEach(day => {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'day-tab' + (day.key === st.currentDayKey ? ' active' : '');
        btn.innerHTML = `<span class="day-tab-name">${day.short}요일</span><span class="day-tab-sub">${day.sub}</span>`;
        btn.addEventListener('click', () => {
          st.currentDayKey = day.key;
          st.currentIndex = getTargetWordIndexForDay(day.key);
          isEditMode = false;
          searchInputEl.value = '';
          searchClearEl.style.display = 'none';
          renderAll();
          scrollActiveWordIntoView();
          mainContentEl.scrollTop = 0;
        });
        dayTabsEl.appendChild(btn);
      });

      syncSidebarToggleButtonState();
    }

    function renderSidebar() {
      const cfg = catCfg();
      const st = catState();
      const meta = getDayMeta(st.currentDayKey);
      const list = cfg.vocabList[st.currentDayKey];
      const keyword = searchInputEl.value.trim().toLowerCase();

      sidebarDayLabelEl.textContent = `${meta.name} ${cfg.itemLabel}`;
      storageLabelEl.textContent = `저장된 ${cfg.unit} 데이터`;
      readLabelEl.textContent = `읽은 ${cfg.unit}`;
      favLabelEl.textContent = `즐겨찾기 ${cfg.unit}`;
      storagePillEl.textContent = `${countSavedTotal()} / 364`;
      readCountPillEl.textContent = `${countReadTotal()} / 364`;
      favCountPillEl.textContent = `${countFavTotal()}개`;
      answerCountPillEl.textContent = `${countAnswersTotal()}개`;
      wordListEl.innerHTML = '';

      let visibleCount = 0;
      list.forEach((item, idx) => {
        const [title, orig] = item;
        const key = getWordKey(st.currentDayKey, idx);
        const ready = hasContent(getEntry(key));
        const answered = hasAnswer(key);
        const read = isWordRead(key);
        const readDate = read ? getWordReadDate(key) : '';
        const fav = isWordFav(key);

        if (keyword) {
          const hay = `${pad2(idx + 1)} ${title} ${orig}`.toLowerCase();
          if (!hay.includes(keyword)) return;
        }
        visibleCount++;

        const row = document.createElement('div');
        row.className = 'word-item'
          + (idx === st.currentIndex ? ' active' : '')
          + (read ? ' is-read' : '');
        row.setAttribute('role', 'button');
        row.tabIndex = 0;
        row.innerHTML = `
          <button type="button" class="item-num" title="${read ? (readDate ? `읽음 (${readDate}) · 클릭하여 해제` : '읽음 · 클릭하여 해제') : '번호를 눌러 읽음 표시 전환'}" aria-pressed="${read ? 'true' : 'false'}">${pad2(idx + 1)}</button>
          <div class="word-item-text">
            <div class="word-item-title">${escapeHtml(title)}</div>
            <div class="word-item-sub">${escapeHtml(orig)}</div>
          </div>
          <div class="status-dots">
            ${fav ? `<span class="fav-dot-icon" title="즐겨찾기됨">${getHeartSvg(true, 12)}</span>` : ''}
            ${ready ? '<span class="ready-dot" title="본문 저장됨"></span>' : ''}
            ${answered ? '<span class="answer-dot" title="답변 작성됨"></span>' : ''}
          </div>
        `;

        const numBtn = row.querySelector('.item-num');
        numBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          toggleWordRead(st.currentDayKey, idx);
        });

        const selectWord = () => {
          st.currentIndex = idx;
          isEditMode = false;
          renderSidebar();
          renderDetail();
          if (isMobileViewport()) closeMobileSidebar();
          mainContentEl.scrollTo({ top: 0, behavior: 'smooth' });
        };
        row.addEventListener('click', selectWord);
        row.addEventListener('keydown', (e) => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            selectWord();
          }
        });

        wordListEl.appendChild(row);
      });

      const readDay = countReadInDay(st.currentDayKey);
      sidebarCountPillEl.textContent = keyword ? `검색 ${visibleCount}개` : `읽음 ${readDay} / ${list.length}`;

      if (visibleCount === 0) {
        const empty = document.createElement('div');
        empty.style.cssText = 'padding: 28px 12px; text-align: center; color: #94a3b8; font-size: 13.5px;';
        empty.textContent = '검색 결과가 없습니다.';
        wordListEl.appendChild(empty);
      }
    }

    function bindAnswerBoxEvents(key) {
      const st = catState();
      const textareas = Array.from(bookPageEl.querySelectorAll('.answer-textarea'));
      const statusEl = document.getElementById('answerSaveStatus');
      const saveBtn = document.getElementById('answerSaveBtn');
      const clearBtn = document.getElementById('answerClearBtn');
      if (!textareas.length) return;

      resizeAllAnswerTextareas();
      requestAnimationFrame(resizeAllAnswerTextareas);

      const persistAnswers = (showNotice) => {
        const items = textareas.map(ta => ta.value);
        const hasAny = items.some(v => v.trim().length > 0);
        if (hasAny) {
          const nowStr = formatNow24();
          st.storedAnswers[key] = { items, updatedAt: nowStr };
          if (statusEl) statusEl.textContent = `저장됨 · ${nowStr}`;
        } else {
          delete st.storedAnswers[key];
          if (statusEl) statusEl.textContent = '미작성';
        }
        saveCategoryStorage(currentCatKey, 'answers');
        renderSidebar();
        if (showNotice) showToast('답변이 저장되었습니다.');
      };

      const syncLikeBadge = (ta) => {
        const hasVal = ta.value.trim().length > 0;
        ta.classList.toggle('has-value', hasVal);
        const badge = ta.parentElement ? ta.parentElement.querySelector('.answer-like-badge') : null;
        if (!badge) return;
        const wasShown = badge.classList.contains('show');
        if (hasVal !== wasShown) {
          badge.classList.toggle('show', hasVal);
        }
      };

      let saveTimer = null;
      textareas.forEach(ta => {
        syncLikeBadge(ta);
        ta.addEventListener('input', () => {
          syncLikeBadge(ta);
          autoResizeTextarea(ta);
          if (statusEl) statusEl.textContent = '입력 중...';
          clearTimeout(saveTimer);
          saveTimer = setTimeout(() => persistAnswers(false), 500);
        });

        ta.addEventListener('blur', () => {
          syncLikeBadge(ta);
          clearTimeout(saveTimer);
          persistAnswers(false);
        });
      });

      if (saveBtn) {
        saveBtn.addEventListener('click', () => {
          clearTimeout(saveTimer);
          persistAnswers(true);
        });
      }

      if (clearBtn) {
        clearBtn.addEventListener('click', () => {
          const hasAny = textareas.some(ta => ta.value.trim().length > 0);
          if (!hasAny) return;
          if (!confirm('작성한 답변을 모두 지울까요?')) return;
          textareas.forEach(ta => {
            ta.value = '';
            syncLikeBadge(ta);
            autoResizeTextarea(ta);
          });
          clearTimeout(saveTimer);
          persistAnswers(false);
          showToast('답변을 지웠습니다.');
        });
      }
    }

    function renderDetail() {
      const cfg = catCfg();
      const st = catState();
      const meta = getDayMeta(st.currentDayKey);
      const list = cfg.vocabList[st.currentDayKey];
      const [title, orig] = list[st.currentIndex];
      const key = getWordKey(st.currentDayKey, st.currentIndex);
      const entry = getEntry(key);

      toolbarDayPillEl.textContent = meta.name;
      toolbarThemeEl.textContent = meta.theme;
      navOrderEl.textContent = `${pad2(st.currentIndex + 1)} / ${list.length}`;
      syncCurrentReadIndicators();
      syncFavIndicators();
      prevWordBtn.disabled = st.currentIndex === 0;
      nextWordBtn.disabled = st.currentIndex === list.length - 1;
      editToggleBtn.textContent = isEditMode ? '보기' : '편집';

      const isCurrentFav = isWordFav(key);
      const titleWrapHtml = `
        <div class="book-title-wrap">
          <div class="book-title-main">
            <h1 class="book-word-kr">${escapeHtml(title)}</h1>
            <span class="book-word-orig">${escapeHtml(orig)}</span>
          </div>
          <button type="button" class="title-fav-btn${isCurrentFav ? ' is-fav' : ''}" id="titleFavBtn" title="클릭하여 즐겨찾기 전환" aria-label="즐겨찾기" aria-pressed="${isCurrentFav ? 'true' : 'false'}">${getHeartSvg(isCurrentFav, 19)}</button>
        </div>
      `;

      if (isEditMode) {
        const qText = entry && Array.isArray(entry.questions) ? entry.questions.join('\n') : '';
        bookPageEl.innerHTML = `
          ${titleWrapHtml}
          <div class="edit-form">
            <div class="edit-field">
              <label class="edit-label">어원 및 개념 설명</label>
              <textarea class="edit-textarea" id="edOrigin" placeholder="${escapeHtml(cfg.originPlaceholder)}">${escapeHtml(entry?.origin || '')}</textarea>
            </div>
            <div class="edit-field">
              <label class="edit-label">관련 명언</label>
              <input type="text" class="edit-input" id="edQuote" placeholder="“명언 문구를 입력하세요.”" value="${escapeHtml(entry?.quote || '')}" />
            </div>
            <div class="edit-field">
              <label class="edit-label">명언 출처 / 인물</label>
              <input type="text" class="edit-input" id="edAuthor" placeholder="인물 이름" value="${escapeHtml(entry?.author || '')}" />
            </div>
            <div class="edit-field">
              <label class="edit-label">상세 설명 (에세이 · 문단 구분은 빈 줄)</label>
              <textarea class="edit-textarea essay-area" id="edEssay" placeholder="상세 설명과 에세이를 입력하세요.">${escapeHtml(entry?.essay || '')}</textarea>
            </div>
            <div class="edit-field">
              <label class="edit-label">오늘의 질문 (한 줄에 하나씩 입력)</label>
              <textarea class="edit-textarea" id="edQuestions" placeholder="질문 1&#10;질문 2&#10;질문 3">${escapeHtml(qText)}</textarea>
            </div>
            <div class="edit-footer">
              <button type="button" class="nav-btn" id="edCancelBtn">취소</button>
              <button type="button" class="hdr-btn btn-green" id="edSaveBtn">로컬스토리지에 저장</button>
            </div>
          </div>
        `;
        document.getElementById('edCancelBtn').addEventListener('click', () => {
          isEditMode = false;
          renderDetail();
        });
        document.getElementById('edSaveBtn').addEventListener('click', () => {
          const updated = {
            origin: document.getElementById('edOrigin').value.trim(),
            quote: document.getElementById('edQuote').value.trim(),
            author: document.getElementById('edAuthor').value.trim(),
            essay: document.getElementById('edEssay').value.trim(),
            questions: document.getElementById('edQuestions').value
              .split('\n').map(s => s.trim()).filter(Boolean)
          };
          if (hasContent(updated)) {
            st.storedEntries[key] = updated;
          } else {
            delete st.storedEntries[key];
          }
          saveCategoryStorage(currentCatKey, 'essays');
          isEditMode = false;
          renderSidebar();
          renderDetail();
          showToast('내용이 로컬스토리지에 저장되었습니다.');
        });
        return;
      }

      const buildQuestionsSectionHtml = (questionsArr) => {
        const listQs = Array.isArray(questionsArr) ? questionsArr.filter(Boolean) : [];
        const answerCount = Math.max(1, listQs.length);
        const ansItems = getAnswerItems(key, answerCount);
        const updatedAt = getAnswerUpdatedAt(key);
        const statusText = hasAnswer(key)
          ? (updatedAt ? `저장됨 · ${escapeHtml(updatedAt)}` : '저장됨')
          : '미작성';

        const likeIconSvg = `
          <svg width="17" height="17" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M2 20h2c.55 0 1-.45 1-1v-9c0-.55-.45-1-1-1H2v11zm19.83-7.12c.11-.25.17-.52.17-.8V11c0-1.1-.9-2-2-2h-5.5l.92-4.65c.05-.22.02-.46-.08-.66-.23-.45-.52-.86-.88-1.22L14 2 7.59 8.41C7.21 8.79 7 9.3 7 9.83v7.84C7 18.95 8.05 20 9.34 20h8.11c.7 0 1.36-.37 1.72-.97l2.66-6.15z"/>
          </svg>
        `;

        const blocksHtml = listQs.length
          ? listQs.map((q, idx) => {
              const val = ansItems[idx] || '';
              const hasVal = val.trim().length > 0;
              return `
                <li class="book-q-block">
                  <p class="book-q-item">${escapeHtml(q)}</p>
                  <div class="answer-input-wrap">
                    <textarea class="answer-textarea" data-q-index="${idx}" rows="1" wrap="soft" placeholder="나의 답변을 적어보세요...">${escapeHtml(val)}</textarea>
                    <span class="answer-like-badge${hasVal ? ' show' : ''}" role="img" aria-label="좋아요" title="답변을 작성했어요!">${likeIconSvg}</span>
                  </div>
                </li>
              `;
            }).join('')
          : (() => {
              const val = ansItems[0] || '';
              const hasVal = val.trim().length > 0;
              return `
                <li class="book-q-block">
                  <div class="answer-input-wrap no-indent">
                    <textarea class="answer-textarea" data-q-index="0" rows="1" wrap="soft" placeholder="오늘의 질문에 대한 나의 생각과 답변을 자유롭게 적어보세요...">${escapeHtml(val)}</textarea>
                    <span class="answer-like-badge${hasVal ? ' show' : ''}" role="img" aria-label="좋아요" title="답변을 작성했어요!">${likeIconSvg}</span>
                  </div>
                </li>
              `;
            })();

        return `
          <section class="book-questions">
            <div class="book-q-header">
              <h2 class="book-q-title">오늘의 질문</h2>
              <div class="book-q-line"></div>
              <span class="answer-save-status" id="answerSaveStatus">${statusText}</span>
            </div>
            <ul class="book-q-list">
              ${blocksHtml}
            </ul>
            <div class="answer-box-footer">
              <button type="button" class="answer-clear-btn" id="answerClearBtn">지우기</button>
              <button type="button" class="answer-save-btn" id="answerSaveBtn">답변 저장</button>
            </div>
          </section>
        `;
      };

      if (!hasContent(entry)) {
        bookPageEl.innerHTML = `
          ${titleWrapHtml}
          <div class="pending-box">
            <strong>${escapeHtml(title)}</strong> (<code>${key}</code>)의 ${escapeHtml(cfg.unit)} 에세이 데이터가 아직 등록되지 않았습니다.<br />
            <code>${escapeHtml(cfg.dataDir)}/</code> 폴더의 요일별 JS 파일(<code>sun.js</code>~<code>sat.js</code>)이 같은 폴더에 있으면 자동으로 불러와지며, 상단의 <strong>[설정]</strong> 버튼에서 JSON 파일을 직접 불러올 수도 있습니다.
            <div class="pending-actions">
              <button type="button" class="hdr-btn btn-green" id="inlineImportBtn">JSON 파일 불러오기</button>
              <button type="button" class="nav-btn edit-btn" id="inlineEditBtn">직접 작성하기</button>
            </div>
          </div>
          ${buildQuestionsSectionHtml([])}
        `;
        document.getElementById('inlineImportBtn').addEventListener('click', () => {
          jsonFileInput.value = '';
          jsonFileInput.click();
        });
        document.getElementById('inlineEditBtn').addEventListener('click', () => {
          isEditMode = true;
          renderDetail();
        });
        bindAnswerBoxEvents(key);
        return;
      }

      const paragraphsHtml = String(entry.essay || '')
        .split(/\n\s*\n/)
        .filter(Boolean)
        .map(p => `<p>${escapeHtml(p.trim())}</p>`)
        .join('');

      const quoteHtml = entry.quote ? `
        <blockquote class="book-quote-block">
          <p class="book-quote-text">${escapeHtml(entry.quote)}</p>
          ${entry.author ? `<p class="book-quote-author">_${escapeHtml(entry.author)}</p>` : ''}
        </blockquote>
      ` : '';

      const questionsSectionHtml = buildQuestionsSectionHtml(entry.questions);

      bookPageEl.innerHTML = `
        ${titleWrapHtml}
        ${entry.origin ? `<p class="book-origin">${escapeHtml(entry.origin)}</p>` : ''}
        ${quoteHtml}
        <div class="book-essay">${paragraphsHtml}</div>
        ${questionsSectionHtml}
      `;

      bindAnswerBoxEvents(key);
      updateStickyTitleShadow();
    }

    function renderAll() {
      renderCategoryTabs();
      renderDayTabs();
      renderSidebar();
      renderDetail();
    }

      const activeEl = wordListEl.querySelector('.word-item.active');
      if (activeEl) activeEl.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }

    function scrollActiveDayTabIntoView() {
      const activeTab = dayTabsEl.querySelector('.day-tab.active');
      if (activeTab) activeTab.scrollIntoView({ block: 'nearest', inline: 'center', behavior: 'smooth' });
    }

    function openSettingsModal() {
      const cfg = catCfg();
      settingsModalTitleEl.textContent = `설정 · ${cfg.label} (${cfg.fullTitle})`;
      storageLabelEl.textContent = `저장된 ${cfg.unit} 데이터`;
      readLabelEl.textContent = `읽은 ${cfg.unit}`;
      favLabelEl.textContent = `즐겨찾기 ${cfg.unit}`;
      exportBtnTitleEl.textContent = `${cfg.label} 탭 백업 (JSON 저장하기)`;
      exportBtnDescEl.textContent = `${cfg.label} 본문, 읽음·즐겨찾기 기록, 질문 답변을 JSON 파일로 내보냅니다.`;

      storagePillEl.textContent = `${countSavedTotal()} / 364`;
      readCountPillEl.textContent = `${countReadTotal()} / 364`;

      answerCountPillEl.textContent = `${countAnswersTotal()}개`;
      settingsModalEl.classList.add('open');
    }

    function syncToTodayAndNextWord(showNotice) {
      const todayDateStr = getLocalDateStr();
      const todayKey = getTodayDayKey();
      const cfg = catCfg();
      const st = catState();
      lastCheckedDateStr = todayDateStr;
      st.currentDayKey = todayKey;
      st.currentIndex = getTargetWordIndexForDay(todayKey);
      st.initializedPos = true;
      isEditMode = false;
      searchInputEl.value = '';
      searchClearEl.style.display = 'none';

      scrollActiveDayTabIntoView();
      scrollActiveWordIntoView();
      mainContentEl.scrollTop = 0;

        const meta = getDayMeta(todayKey);

    function checkDayRollover() {
      const todayDateStr = getLocalDateStr();
      if (lastCheckedDateStr && todayDateStr !== lastCheckedDateStr) {
        CATEGORY_ORDER.forEach(ck => { stateByCat[ck].initializedPos = false; });
        syncToTodayAndNextWord(true);
      }
    }

    function closeSettingsModal() {
      settingsModalEl.classList.remove('open');
    }

    function renderQaListModal() {
      const cfg = catCfg();
      const st = catState();
      const answeredTotal = countAnswersTotal();
      const curDayMeta = getDayMeta(st.currentDayKey);
      qaFilterAnsweredBtn.textContent = `답변한 ${cfg.unit} (${answeredTotal})`;
      qaFilterDayBtn.textContent = `${curDayMeta.name} (${cfg.vocabList[st.currentDayKey].length})`;
      qaFilterAllBtn.textContent = `전체 (364)`;

      qaFilterTabsEl.querySelectorAll('.qa-filter-btn').forEach(btn => {
        btn.classList.toggle('active', btn.dataset.filter === qaModalFilter);
      });

      const kw = qaSearchInputEl.value.trim().toLowerCase();
      const rows = [];

      const daysToScan = qaModalFilter === 'day'
        ? [curDayMeta]
        : cfg.daysMeta;

      daysToScan.forEach((dayMeta, dayOrder) => {
        const list = cfg.vocabList[dayMeta.key] || [];
        list.forEach(([word, orig], idx) => {
          const key = getWordKey(dayMeta.key, idx);
          const answered = hasAnswer(key);
          if (qaModalFilter === 'answered' && !answered) return;

          const entry = getEntry(key);
          const origin = entry?.origin || '';
          const questions = Array.isArray(entry?.questions) ? entry.questions.filter(Boolean) : [];
          const ansItems = getAnswerItems(key, Math.max(1, questions.length));
          const updatedAt = getAnswerUpdatedAt(key);
          const read = isWordRead(key);

          if (kw) {
            const hay = [
              dayMeta.name, pad2(idx + 1), word, orig, origin,
              questions.join(' '), ansItems.join(' ')
            ].join(' ').toLowerCase();
            if (!hay.includes(kw)) return;
          }

          rows.push({
            dayKey: dayMeta.key,
            dayName: dayMeta.name,
            dayOrder,
            idx,
            key,
            word,
            orig,
            origin,
            questions,
            ansItems,
            answered,
            updatedAt,
            read
          });
        });
      });

      if (qaModalFilter === 'answered') {
        rows.sort((a, b) => {
          if (a.updatedAt && b.updatedAt && a.updatedAt !== b.updatedAt) {
            return b.updatedAt.localeCompare(a.updatedAt);
          }
          if (a.updatedAt && !b.updatedAt) return -1;
          if (!a.updatedAt && b.updatedAt) return 1;
          if (a.dayOrder !== b.dayOrder) return a.dayOrder - b.dayOrder;
          return a.idx - b.idx;
        });
      }

      qaListCountBadgeEl.textContent = `${rows.length}개`;

      if (!rows.length) {
        if (qaModalFilter === 'answered' && !kw) {
          qaListBodyEl.innerHTML = `
            <div class="qa-empty-state">
              아직 작성된 질문 답변이 없습니다.<br />
              상단의 <strong>${escapeHtml(curDayMeta.name)}</strong> 또는 <strong>전체</strong> 탭을 누르면 모든 ${escapeHtml(cfg.itemLabel)}의 설명과 질문을 한눈에 볼 수 있습니다.
            </div>
          `;
        } else {
          qaListBodyEl.innerHTML = `<div class="qa-empty-state">조건에 맞는 ${escapeHtml(cfg.itemLabel)}가 없습니다.</div>`;
        }
        return;
      }

      const cardsHtml = rows.map(r => {
        const qaPairsHtml = r.questions.length
          ? r.questions.map((q, qIdx) => {
              const ansText = (r.ansItems[qIdx] || '').trim();
              return `
                <div class="qa-pair">
                  <p class="qa-question">${escapeHtml(q)}</p>
                  <p class="qa-answer${ansText ? '' : ' is-empty'}">${ansText ? escapeHtml(ansText) : '답변 미작성'}</p>
                </div>
              `;
            }).join('')
          : (() => {
              const ansText = (r.ansItems[0] || '').trim();
              return `
                <div class="qa-pair">
                  <p class="qa-answer${ansText ? '' : ' is-empty'}">${ansText ? escapeHtml(ansText) : '답변 미작성'}</p>
                </div>
              `;
            })();

        return `
          <div class="qa-card">
            <div class="qa-card-head">
              <div class="qa-card-title-group">
                <div class="qa-card-meta-row">
                  <span class="qa-day-badge${r.read ? ' is-read' : ''}">${escapeHtml(r.dayName)} · ${pad2(r.idx + 1)}</span>
                  ${r.updatedAt ? `<span class="qa-updated-at">답변 ${escapeHtml(r.updatedAt)}</span>` : ''}
                </div>
                <div class="qa-word-row">
                  <span class="qa-word-kr">${escapeHtml(r.word)}</span>
                  <span class="qa-word-orig">${escapeHtml(r.orig)}</span>
                </div>
              </div>
              <button type="button" class="qa-jump-btn" data-day="${r.dayKey}" data-idx="${r.idx}">이동</button>
            </div>
            ${r.origin ? `<p class="qa-origin-box">${escapeHtml(r.origin)}</p>` : ''}
            <div class="qa-items">${qaPairsHtml}</div>
          </div>
        `;
      }).join('');

      qaListBodyEl.innerHTML = cardsHtml;
    }

    function openQaListModal() {
      qaModalFilter = countAnswersTotal() > 0 ? 'answered' : 'day';
      qaSearchInputEl.value = '';
      qaSearchClearEl.style.display = 'none';
      renderQaListModal();
      qaListModalEl.classList.add('open');
      qaListBodyEl.scrollTop = 0;
    }

    function closeQaListModal() {
      qaListModalEl.classList.remove('open');
    }

    function renderFavListModal() {
      const cfg = catCfg();
      const kw = favSearchInputEl.value.trim().toLowerCase();
      const rows = [];

      cfg.daysMeta.forEach((dayMeta, dayOrder) => {
        const list = cfg.vocabList[dayMeta.key] || [];
        list.forEach(([word, orig], idx) => {
          const key = getWordKey(dayMeta.key, idx);
          if (!isWordFav(key)) return;

          const entry = getEntry(key);
          const origin = entry?.origin || '';
          const read = isWordRead(key);
          const favAt = getWordFavAt(key);

          if (kw) {
            const hay = `${dayMeta.name} ${pad2(idx + 1)} ${word} ${orig} ${origin}`.toLowerCase();
            if (!hay.includes(kw)) return;
          }

          rows.push({
            dayKey: dayMeta.key,
            dayName: dayMeta.name,
            dayOrder,
            idx,
            key,
            word,
            orig,
            origin,
            read,
            favAt
          });
        });
      });

      rows.sort((a, b) => {
        if (b.favAt !== a.favAt) return b.favAt - a.favAt;
        if (a.dayOrder !== b.dayOrder) return a.dayOrder - b.dayOrder;
        return a.idx - b.idx;
      });

      favListCountBadgeEl.textContent = `${rows.length}개`;

      if (!rows.length) {
        favListBodyEl.innerHTML = kw
          ? `<div class="qa-empty-state">검색 결과가 없습니다.</div>`
          : `<div class="qa-empty-state">아직 즐겨찾기한 ${escapeHtml(cfg.itemLabel)}가 없습니다.<br />제목 우측의 <strong>하트(♡)</strong> 아이콘을 눌러 마음에 남는 ${escapeHtml(cfg.itemLabel)}를 모아 보세요.</div>`;
        return;
      }

      favListBodyEl.innerHTML = rows.map(r => `
        <div class="fav-item-card" role="button" tabindex="0" data-day="${r.dayKey}" data-idx="${r.idx}">
          <div class="fav-item-main">
            <div class="fav-item-meta">
              <span class="qa-day-badge${r.read ? ' is-read' : ''}">${escapeHtml(r.dayName)} · ${pad2(r.idx + 1)}</span>
            </div>
            <div class="fav-item-word-row">
              <span class="fav-item-word">${escapeHtml(r.word)}</span>
              <span class="fav-item-orig">${escapeHtml(r.orig)}</span>
            </div>
            ${r.origin ? `<p class="fav-item-origin">${escapeHtml(r.origin)}</p>` : ''}
          </div>
          <button type="button" class="fav-remove-btn" data-remove-day="${r.dayKey}" data-remove-idx="${r.idx}" title="즐겨찾기 해제" aria-label="즐겨찾기 해제">${getHeartSvg(true, 15)}</button>
        </div>
      `).join('');
    }

    function openFavListModal() {
      favSearchInputEl.value = '';
      favSearchClearEl.style.display = 'none';
      renderFavListModal();
      favListModalEl.classList.add('open');
      favListBodyEl.scrollTop = 0;
    }

    function closeFavListModal() {
      favListModalEl.classList.remove('open');
    }

    // 백업 데이터 빌더 (카테고리 1개)
    function buildCategoryExportObject(ck) {
      const cfg = catCfg(ck);
      const ordered = {};
      cfg.daysMeta.forEach(d => {
        cfg.vocabList[d.key].forEach(([word, orig], idx) => {
          const key = getWordKey(d.key, idx);
          const item = getEntry(key, ck);
          const answered = hasAnswer(key, ck);
          const read = isWordRead(key, ck);
          const fav = isWordFav(key, ck);
          if (hasContent(item) || answered || read || fav) {
            const qCount = Array.isArray(item?.questions) ? item.questions.length : 1;
            ordered[key] = {
              word,
              orig,
              origin: item?.origin || '',
              quote: item?.quote || '',
              author: item?.author || '',
              essay: item?.essay || '',
              questions: Array.isArray(item?.questions) ? item.questions : [],
              ...(read ? {
                isRead: true,
                readAt: getWordReadAt(key, ck),
                readDate: getWordReadDate(key, ck)
              } : {}),
              ...(fav ? {
                isFavorite: true,
                favAt: getWordFavAt(key, ck)
              } : {}),
              ...(answered ? {
                userAnswers: getAnswerItems(key, qCount, ck),
                userAnswerUpdatedAt: getAnswerUpdatedAt(key, ck)
              } : {})
            };
          }
        });
      });
      return ordered;
    }

    function triggerDownloadJson(obj, filename) {
      const blob = new Blob([JSON.stringify(obj, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    // 카테고리 탭 클릭 이벤트
    categoryTabsEl.addEventListener('click', (e) => {
      const tab = e.target.closest('.cat-tab');
      if (!tab) return;
      const ck = tab.dataset.cat;
      if (ck && ck !== currentCatKey) {
        switchCategory(ck);
      }
    });

    // 사이드바 & 모달 이벤트
    sidebarBackdropEl.addEventListener('click', closeMobileSidebar);
    sidebarCloseBtn.addEventListener('click', closeMobileSidebar);
    settingsCloseBtn.addEventListener('click', closeSettingsModal);
    settingsModalEl.addEventListener('click', (e) => {
      if (e.target === settingsModalEl) closeSettingsModal();
    });

    qaListBtn.addEventListener('click', openQaListModal);
    qaListCloseBtn.addEventListener('click', closeQaListModal);
    qaListModalEl.addEventListener('click', (e) => {
      if (e.target === qaListModalEl) closeQaListModal();
    });
    qaFilterTabsEl.addEventListener('click', (e) => {
      const btn = e.target.closest('.qa-filter-btn');
      if (!btn) return;
      qaModalFilter = btn.dataset.filter || 'answered';
      renderQaListModal();
      qaListBodyEl.scrollTop = 0;
    });
    qaSearchInputEl.addEventListener('input', () => {
      qaSearchClearEl.style.display = qaSearchInputEl.value ? 'block' : 'none';
      renderQaListModal();
    });
    qaSearchClearEl.addEventListener('click', () => {
      qaSearchInputEl.value = '';
      qaSearchClearEl.style.display = 'none';
      renderQaListModal();
      qaSearchInputEl.focus();
    });
    qaListBodyEl.addEventListener('click', (e) => {
      const jumpBtn = e.target.closest('.qa-jump-btn');
      if (!jumpBtn) return;
      const targetDay = jumpBtn.dataset.day;
      const targetIdx = Number(jumpBtn.dataset.idx);
      if (!targetDay || Number.isNaN(targetIdx)) return;
      const st = catState();
      st.currentDayKey = targetDay;
      st.currentIndex = targetIdx;
      isEditMode = false;
      searchInputEl.value = '';
      searchClearEl.style.display = 'none';
      closeQaListModal();
      renderAll();
      scrollActiveDayTabIntoView();
      scrollActiveWordIntoView();
      mainContentEl.scrollTo({ top: 0, behavior: 'smooth' });
    });

    favListBtn.addEventListener('click', openFavListModal);
    favListCloseBtn.addEventListener('click', closeFavListModal);
    favListModalEl.addEventListener('click', (e) => {
      if (e.target === favListModalEl) closeFavListModal();
    });
    favSearchInputEl.addEventListener('input', () => {
      favSearchClearEl.style.display = favSearchInputEl.value ? 'block' : 'none';
      renderFavListModal();
    });
    favSearchClearEl.addEventListener('click', () => {
      favSearchInputEl.value = '';
      favSearchClearEl.style.display = 'none';
      renderFavListModal();
      favSearchInputEl.focus();
    });

    const navigateFromFavCard = (card) => {
      const targetDay = card.dataset.day;
      const targetIdx = Number(card.dataset.idx);
      if (!targetDay || Number.isNaN(targetIdx)) return;
      const st = catState();
      st.currentDayKey = targetDay;
      st.currentIndex = targetIdx;
      isEditMode = false;
      searchInputEl.value = '';
      searchClearEl.style.display = 'none';
      closeFavListModal();
      renderAll();
      scrollActiveDayTabIntoView();
      scrollActiveWordIntoView();
      mainContentEl.scrollTo({ top: 0, behavior: 'smooth' });
    };

    favListBodyEl.addEventListener('click', (e) => {
      const removeBtn = e.target.closest('.fav-remove-btn');
      if (removeBtn) {
        e.stopPropagation();
        const rDay = removeBtn.dataset.removeDay;
        const rIdx = Number(removeBtn.dataset.removeIdx);
        if (rDay && !Number.isNaN(rIdx)) {
          toggleWordFav(rDay, rIdx);
          renderFavListModal();
        }
        return;
      }
      const card = e.target.closest('.fav-item-card');
      if (card) navigateFromFavCard(card);
    });

    favListBodyEl.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter' && e.key !== ' ') return;
      if (e.target.closest('.fav-remove-btn')) return;
      const card = e.target.closest('.fav-item-card');
      if (card) {
        e.preventDefault();
        navigateFromFavCard(card);
      }
    });

    bookPageEl.addEventListener('click', (e) => {
      if (e.target.closest('#titleFavBtn')) {
        const st = catState();
        toggleWordFav(st.currentDayKey, st.currentIndex);
      }
    });

    window.addEventListener('resize', () => {
      if (!isMobileViewport()) {
        sidebarEl.classList.remove('open');
        sidebarBackdropEl.classList.remove('open');
      }
      syncSidebarToggleButtonState();
      resizeAllAnswerTextareas();
    });

    function updateStickyTitleShadow() {
      const titleWrap = bookPageEl.querySelector('.book-title-wrap');
      if (!titleWrap) return;
      const toolbarEl = mainContentEl.querySelector('.page-toolbar');
      const threshold = toolbarEl ? toolbarEl.offsetHeight : 10;
      titleWrap.classList.toggle('is-stuck', mainContentEl.scrollTop > threshold);
    }

    mainContentEl.addEventListener('scroll', updateStickyTitleShadow, { passive: true });

    sidebarEl.addEventListener('transitionend', (e) => {
      if (e.propertyName === 'margin-left') {
        resizeAllAnswerTextareas();
      }
    });

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => resizeAllAnswerTextareas());
    }

    if (typeof ResizeObserver !== 'undefined') {
      let lastBookPageWidth = 0;
      const pageResizeObserver = new ResizeObserver(() => {
        const w = Math.round(bookPageEl.getBoundingClientRect().width);
        if (w > 0 && w !== lastBookPageWidth) {
          lastBookPageWidth = w;
          resizeAllAnswerTextareas();
        }
      });
      pageResizeObserver.observe(bookPageEl);
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        closeSettingsModal();
        closeQaListModal();
        closeFavListModal();
        if (isMobileViewport()) closeMobileSidebar();
      }
    });

    searchInputEl.addEventListener('input', () => {
      searchClearEl.style.display = searchInputEl.value ? 'block' : 'none';
      renderSidebar();
    });

    searchClearEl.addEventListener('click', () => {
      searchInputEl.value = '';
      searchClearEl.style.display = 'none';
      renderSidebar();
      searchInputEl.focus();
    });

    navOrderEl.addEventListener('click', () => {
      const st = catState();
      toggleWordRead(st.currentDayKey, st.currentIndex);
    });

    editToggleBtn.addEventListener('click', () => {
      isEditMode = !isEditMode;
      renderDetail();
    });

    prevWordBtn.addEventListener('click', () => {
      const st = catState();
      if (st.currentIndex > 0) {
        st.currentIndex--;
        isEditMode = false;
        renderSidebar();
        renderDetail();
        scrollActiveWordIntoView();
        mainContentEl.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    todayWordBtn.addEventListener('click', () => {
      const cfg = catCfg();
      const st = catState();
      const todayDateStr = getLocalDateStr();
      const todayKey = getTodayDayKey();
      const todayMeta = getDayMeta(todayKey);
      const readTodayIdx = getReadIndexOnDate(todayKey, todayDateStr);
      const targetIdx = readTodayIdx !== -1 ? readTodayIdx : getNextWordIndexForDay(todayKey);
      const targetWord = cfg.vocabList[todayKey][targetIdx][0];

      lastCheckedDateStr = todayDateStr;
      st.currentDayKey = todayKey;
      st.currentIndex = targetIdx;
      isEditMode = false;
      searchInputEl.value = '';
      searchClearEl.style.display = 'none';
      renderAll();
      scrollActiveDayTabIntoView();
      scrollActiveWordIntoView();
      mainContentEl.scrollTo({ top: 0, behavior: 'smooth' });
      if (readTodayIdx !== -1) {
        showToast(`오늘(${todayMeta.name} · ${todayDateStr}) 읽은 ${pad2(targetIdx + 1)}번 '${targetWord}'(으)로 이동했습니다.`);
      } else {
        showToast(`오늘(${todayMeta.name}) · ${pad2(targetIdx + 1)}번 '${targetWord}'(으)로 이동했습니다.`);
      }
    });

    nextWordBtn.addEventListener('click', () => {
      const cfg = catCfg();
      const st = catState();
      if (st.currentIndex < cfg.vocabList[st.currentDayKey].length - 1) {
        st.currentIndex++;
        isEditMode = false;
        renderSidebar();
        renderDetail();
        scrollActiveWordIntoView();
        mainContentEl.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });

    // 저장하기: JSON 불러오기 (단일 탭 JSON 및 4개 탭 통합 백업 JSON 모두 자동 인식)
    document.getElementById('importBtn').addEventListener('click', () => {
      jsonFileInput.value = '';
      jsonFileInput.click();
    });

    jsonFileInput.addEventListener('change', async (e) => {
      const files = Array.from(e.target.files || []);
      if (!files.length) return;

      let totalLoaded = 0;
      let totalAnswersLoaded = 0;
      let totalReadLoaded = 0;
      let totalFavLoaded = 0;
      let errorCount = 0;
      const touchedCats = new Set();

      for (const file of files) {
        try {
          const text = await file.text();
          const parsed = JSON.parse(text);
          if (parsed && typeof parsed === 'object' && parsed._unifiedCategories && typeof parsed._unifiedCategories === 'object') {
            CATEGORY_ORDER.forEach(ck => {
              if (parsed._unifiedCategories[ck]) {
                const res = mergeJsonPayloadForCategory(parsed._unifiedCategories[ck], ck);
                totalLoaded += res.added;
                totalAnswersLoaded += res.answersAdded;
                totalReadLoaded += res.readAdded;
                totalFavLoaded += res.favAdded;
                touchedCats.add(ck);
              }
            });
          } else {
            const res = mergeJsonPayloadForCategory(parsed, currentCatKey);
            totalLoaded += res.added;
            totalAnswersLoaded += res.answersAdded;
            totalReadLoaded += res.readAdded;
            totalFavLoaded += res.favAdded;
            touchedCats.add(currentCatKey);
          }
        } catch (err) {
          console.error(file.name, err);
          errorCount++;
        }
      }

      touchedCats.forEach(ck => {
        saveCategoryStorage(ck);
        if (totalReadLoaded > 0) {
          const st = catState(ck);
          st.currentIndex = getTargetWordIndexForDay(st.currentDayKey, ck);
        }
      });

      renderAll();
      scrollActiveWordIntoView();
      closeSettingsModal();

      const extraParts = [];
      if (totalReadLoaded > 0) extraParts.push(`읽음 ${totalReadLoaded}개`);
      if (totalFavLoaded > 0) extraParts.push(`즐겨찾기 ${totalFavLoaded}개`);
      if (totalAnswersLoaded > 0) extraParts.push(`답변 ${totalAnswersLoaded}개`);
      const extraMsg = extraParts.length ? `, ${extraParts.join(', ')}` : '';
      if (errorCount > 0) {
        showToast(`본문 ${totalLoaded}개${extraMsg} 저장 (오류 ${errorCount}개)`);
      } else {
        showToast(`본문 ${totalLoaded}개${extraMsg} 불러와 저장했습니다.`);
      }
    });

    // 현재 탭 백업
    document.getElementById('exportBtn').addEventListener('click', () => {
      const cfg = catCfg();
      const ordered = buildCategoryExportObject(currentCatKey);
      const count = Object.keys(ordered).length;
      if (count === 0) {
        cfg.daysMeta.forEach(d => {
          cfg.vocabList[d.key].forEach(([word, orig], idx) => {
            ordered[getWordKey(d.key, idx)] = {
              word, orig, origin: '', quote: '', author: '', essay: '', questions: []
            };
          });
        });
      }
      const filename = count === 364 ? cfg.jsonFilename : `${cfg.backupPrefix}${count}.json`;
      triggerDownloadJson(ordered, filename);
      closeSettingsModal();
      showToast(`${cfg.label} 탭 JSON 파일을 백업했습니다.`);
    });

    // 전체 4개 탭 통합 백업
    document.getElementById('exportAllBtn').addEventListener('click', () => {
      const unified = {
        _exportedAt: formatNow24(),
        _unifiedCategories: {}
      };
      CATEGORY_ORDER.forEach(ck => {
        unified._unifiedCategories[ck] = buildCategoryExportObject(ck);
      });
      triggerDownloadJson(unified, `vocab-52-all-backup-${getLocalDateStr()}.json`);
      closeSettingsModal();
      showToast('어휘·감정·욕구·판단 4개 탭 전체를 통합 백업했습니다.');
    });

    // 하위 폴더(word_data, emotion_data, mind_data, judge_data)의 sun.js ~ sat.js 비동기 자동 로드
    function loadAllCategoryDayScripts() {
      CATEGORY_ORDER.forEach(ck => {
        const cfg = catCfg(ck);
        DAY_KEYS.forEach(dk => {
          const s = document.createElement('script');
          s.src = `./${cfg.dataDir}/${dk}.js`;
          s.async = true;
          s.onload = () => {
            loadDefaultDataForCategory(ck);
            if (ck === currentCatKey) {
              renderSidebar();
              renderDetail();
            }
          };
          s.onerror = () => {};
          document.body.appendChild(s);
        });
      });
    }

    // 날짜/요일 변경 감지
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') checkDayRollover();
    });
    window.addEventListener('focus', checkDayRollover);
    setInterval(checkDayRollover, 30000);

    // 초기화
    CATEGORY_ORDER.forEach(ck => {
      loadDefaultDataForCategory(ck);
      loadCategoryStorage(ck);
    });

    try {
      const savedCat = localStorage.getItem(ACTIVE_CAT_STORAGE_KEY);
      if (savedCat && CATEGORIES[savedCat]) currentCatKey = savedCat;
    } catch (_) {}

    syncToTodayAndNextWord(false);
    loadAllCategoryDayScripts();
  
  </script>
</body>
</html>
